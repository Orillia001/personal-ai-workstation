<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>课程思维导图 · 深色 A 版 Demo</title>
  <style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#242824;background:#f8f8f6;font-synthesis:none;--line:#e7e8e4;--muted:#737973;--accent:#255f49;--tint:#edf5ef;--paper:#fff;--shadow:0 12px 30px #17281b0a}
*{box-sizing:border-box}
body{margin:0;min-width:320px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #438b67;outline-offset:2px}
.app{min-height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 7px 20px;font-size:13px;font-weight:720}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:white;background:#252d28;font-weight:700}
.muted{color:var(--muted)}
.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:700}
.section-title{font-size:11px;color:#858b84;font-weight:700;margin:24px 10px 8px;display:flex;align-items:center;justify-content:space-between}
.section-title button{background:transparent;border:0;color:#858b84;font-size:17px;padding:0 4px}
.nav-button,.tree-name,.tree-toggle,.child-button{border:0;background:transparent;text-align:left;color:#424a43}
.nav-button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:8px;font-size:12px}
.nav-button:hover,.tree-name:hover,.child-button:hover{background:#f2f4f0}
.nav-button.active{background:#e9f2eb;color:var(--accent);font-weight:650}
.nav-ico{width:18px;text-align:center;font-size:15px;color:#68736a}
.project-search{width:100%;border:1px solid var(--line);border-radius:8px;background:#fafbf9;padding:9px 11px;font-size:11px;outline:0}
.project-search:focus{border-color:#9bbba4;background:#fff}
.tree{display:grid;gap:3px;margin-top:10px}
.project-row{display:grid;grid-template-columns:25px minmax(0,1fr);align-items:center;border-radius:8px}
.project-row.selected,.child-button.selected{background:#e9f2eb;color:var(--accent)}
.tree-toggle{padding:7px 5px;text-align:center;color:#8a928a;font-size:10px}
.tree-name{padding:8px 4px 8px 0;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600}
.children{margin:2px 0 7px 25px;border-left:1px solid #e5e9e3;padding-left:8px;display:grid;gap:1px}
.child-button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 8px;border-radius:7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.child-dot{width:5px;height:5px;border-radius:50%;background:#9aac9d;flex:none}
.child-button.selected .child-dot{background:var(--accent)}
.empty{color:var(--muted);font-size:11px;padding:11px}
.side-bottom{margin-top:auto;padding:16px 8px 3px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.6}
.sidebar,.project-pane{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:23px 14px 16px;min-width:0;overflow-y:auto}
.sidebar-body,.pane-body{min-height:0}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px;border-bottom:1px solid var(--line);background:#fff}
.breadcrumb{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px}
.pill{font-size:10px;color:#5a6e60;background:#f0f5ef;padding:6px 9px;border-radius:20px;white-space:nowrap}
.button{border:1px solid #dfe4dd;background:#fff;border-radius:8px;padding:8px 11px;font-size:11px;color:#384139;white-space:nowrap}
.button:hover{border-color:#a8b9a9}
.button.primary{color:#fff;background:var(--accent);border-color:var(--accent)}
.button.ghost{background:#f6f7f4}
.content{max-width:1170px;margin:0 auto;padding:34px 34px 120px;width:100%}
.title-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:27px}
.title-row h1{font-size:clamp(23px,3vw,33px);letter-spacing:-.04em;font-weight:660;margin:8px 0 8px}
.title-row p{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
.status{display:inline-flex;align-items:center;gap:6px;color:#29694f;font-size:10px}
.status:before{content:"";width:6px;height:6px;border-radius:50%;background:#3baf72}
.cards{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:19px;min-width:0}
.card h2{font-size:13px;margin:0 0 16px;font-weight:690}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-head small{font-size:10px;color:var(--muted)}
.stage-list{display:grid;gap:10px}
.stage{display:grid;grid-template-columns:25px minmax(0,1fr) auto;align-items:center;gap:9px;font-size:11px;padding:11px 0;border-bottom:1px solid #f0f1ee}
.stage:last-child{border:0}
.stage .num{display:grid;place-items:center;border:1px solid #dbe4da;width:23px;height:23px;border-radius:7px;color:var(--accent);font-size:10px}
.stage small{color:var(--muted);font-size:10px}
.stage b{font-weight:630}
.stage.current .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.activity{display:grid;gap:0}
.activity-row{display:grid;grid-template-columns:75px minmax(0,1fr);gap:9px;padding:11px 0;border-bottom:1px solid #f0f1ee;font-size:11px}
.activity-row:last-child{border:0}
.activity-row time{color:#969d94;font-size:10px}
.activity-row span{color:#4d574f;line-height:1.5}
.composer{margin-top:18px;border:1px solid #dae5da;border-radius:12px;background:#fff;box-shadow:var(--shadow);padding:14px}
.composer label{font-size:11px;font-weight:650}
.composer textarea{display:block;width:100%;min-height:54px;resize:vertical;border:0;outline:0;background:transparent;margin-top:10px;font:inherit;font-size:12px;line-height:1.5;color:#4a544b}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #f0f1ee;padding-top:10px}
.composer-foot span{font-size:10px;color:var(--muted)}
.callout{margin-top:14px;color:var(--muted);font-size:10px;line-height:1.6}
.inspector{background:#fdfdfb;border-left:1px solid var(--line);padding:25px 18px;min-width:0}
.inspector h2{font-size:12px;margin:0 0 20px}
.fact{padding:13px 0;border-top:1px solid var(--line)}
.fact small{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}
.fact strong{font-size:11px;font-weight:600;overflow-wrap:anywhere}
.inspector .button{width:100%;justify-content:center;margin-top:18px}
.mini-list{font-size:10px;color:#59665c;line-height:2;margin-top:12px}
.prototype-switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;background:#202822;color:white;border:1px solid #4d5c50;border-radius:18px;padding:7px 9px;box-shadow:0 12px 35px #1d2a2080;font-size:11px;white-space:nowrap}
.prototype-switcher button{color:white;border:0;background:#3a483d;border-radius:11px;width:30px;height:28px}
.prototype-switcher button:hover{background:#546b58}
.prototype-switcher span{padding:0 7px}
.prototype-switcher small{color:#b4c2b5;font-size:10px}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#8a6831;background:#f8f0df;border-radius:6px;padding:5px 7px}
.layout-a{display:grid;grid-template-columns:254px minmax(0,1fr)}
.layout-a .sidebar{height:100vh;position:sticky;top:0}
.layout-a main{min-width:0}
.layout-a .sidebar .project-search{margin-top:4px}
.layout-b{display:grid;grid-template-columns:62px 270px minmax(0,1fr)}
.icon-rail{background:#f2f4f0;border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:17px 8px}
.icon-rail .mark{margin-bottom:20px}
.rail-button{border:0;background:transparent;color:#707a70;width:40px;height:40px;border-radius:10px;font-size:18px}
.rail-button.active,.rail-button:hover{background:#dce8df;color:var(--accent)}
.rail-bottom{margin-top:auto}
.layout-b .project-pane{height:100vh;position:sticky;top:0}
.layout-b .content{max-width:1060px}
.layout-b .cards{grid-template-columns:minmax(0,1fr) 250px}
.layout-c{display:grid;grid-template-columns:274px minmax(0,1fr) 248px}
.layout-c .sidebar{height:100vh;position:sticky;top:0}
.layout-c .inspector{height:100vh;position:sticky;top:0}
.layout-c .content{padding:30px 28px 120px}
.layout-c .cards{grid-template-columns:1fr}
.layout-c .card:nth-child(2){display:none}
.layout-c .section-title{margin-top:17px}
.layout-c .sidebar .project-search{margin-top:12px}
@media(max-width:1050px){.layout-c{grid-template-columns:250px minmax(0,1fr)}
.layout-c .inspector{display:none}
.layout-b{grid-template-columns:56px 240px minmax(0,1fr)}
.layout-b .cards{grid-template-columns:1fr}
}
@media(max-width:760px){.layout-a,.layout-b,.layout-c{display:block}
.layout-a .sidebar,.layout-b .project-pane,.layout-c .sidebar{height:auto;position:static;max-height:280px;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}
.layout-b .icon-rail{display:none}
.layout-a .sidebar .brand,.layout-c .sidebar .brand{padding-bottom:7px}
.layout-a .sidebar .nav-button,.layout-a .sidebar .side-bottom,.layout-b .project-pane .side-bottom,.layout-c .sidebar .side-bottom{display:none}
.sidebar,.project-pane{padding:12px 15px}
.section-title{margin:10px 8px 5px}
.tree{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.children{display:grid}
.topbar{height:52px;padding:0 17px}
.content,.layout-b .content,.layout-c .content{padding:24px 16px 110px}
.cards{grid-template-columns:1fr}
.title-row{display:block}
.title-row .button{margin-top:13px}
.top-actions .pill{display:none}
}

  </style>
  <style>
.layout-a .sidebar,.layout-c .sidebar,.layout-b .project-pane{overflow:hidden}
.sidebar-body,.pane-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.side-bottom{flex:none}
.layout-a{grid-template-columns:286px minmax(0,1fr)}
.layout-b{grid-template-columns:62px 300px minmax(0,1fr)}
.layout-c{grid-template-columns:306px minmax(0,1fr) 248px}
.category-block{margin:7px 0}
.category-toggle{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#f5f7f4;color:#34463a;border-radius:8px;padding:9px 10px;text-align:left;font-size:11px;font-weight:700}
.category-toggle:hover{background:#eaf2eb}
.category-toggle .chevron{margin-left:auto;color:#829084;font-size:10px}
.category-toggle .count{color:#849187;font-size:10px;font-weight:500}
.category-projects{margin:4px 0 3px 10px;padding-left:8px;border-left:1px solid #e6ebe5}
.category-projects .project-row{grid-template-columns:22px minmax(0,1fr)}
.category-projects .children{margin-left:21px}
.tree{display:block}
.layout-b main{min-width:0}
.layout-c .sidebar .section-title{margin-top:17px}
@media(max-width:1050px){.layout-c{grid-template-columns:282px minmax(0,1fr)}
.layout-b{grid-template-columns:56px 278px minmax(0,1fr)}
}
@media(max-width:760px){.layout-a,.layout-b,.layout-c{display:block}
.layout-a .sidebar,.layout-b .project-pane,.layout-c .sidebar{max-height:360px}
.tree{display:block}
.category-projects .children{display:grid}
}

  </style>
  <style>
.window-studio{margin:0 0 20px;border:1px solid #dce6dc;background:#fff;border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.studio-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}
.studio-head h2{font-size:14px;margin:0 0 5px}
.studio-head p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}
.studio-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#fafbf9}
.studio-toolbar input,.studio-toolbar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;font-size:11px;min-height:35px}
.studio-toolbar input{flex:1 1 170px;min-width:110px}
.studio-toolbar select{flex:0 0 118px}
.studio-toolbar .button{min-height:35px}
.studio-note{font-size:10px;color:var(--muted);margin-left:auto}
.window-canvas{position:relative;min-height:460px;background-color:#f7faf6;background-image:radial-gradient(#dfe7de 1px,transparent 1px);background-size:18px 18px;overflow:hidden}
.window-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:30px}
.tool-window{position:absolute;max-width:calc(100% - 32px);min-width:250px;min-height:175px;resize:both;overflow:auto;border:1px solid #cad8ca;background:#fff;border-radius:11px;box-shadow:0 12px 28px #20372a1c}
.tool-window.maximized{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;max-width:none;height:calc(100% - 16px)!important;resize:none}
.tool-header{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #e8eee6;background:#f5f8f4;cursor:grab;touch-action:none;user-select:none}
.tool-header:active{cursor:grabbing}
.tool-icon{display:grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#e3efe4;color:#356549;font-size:12px;flex:none}
.tool-header strong{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tool-header .tool-kind{font-size:9px;color:#829084;white-space:nowrap}
.tool-header button{border:0;background:transparent;color:#7b877c;border-radius:5px;padding:2px 5px;font-size:13px;cursor:pointer}
.tool-header button:hover{background:#e6eee4;color:#294b32}
.tool-body{padding:11px;font-size:11px;color:#465147}
.tool-body textarea,.tool-body input{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#344136;padding:8px;min-width:0}
.tool-body textarea{display:block;width:100%;min-height:115px;resize:vertical;line-height:1.5}
.tool-entry{display:flex;gap:6px;margin-bottom:9px}
.tool-entry input{flex:1;width:100%}
.tool-entry .button{padding:7px 9px}
.tool-list{display:grid;gap:5px}
.tool-list-row{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px solid #f0f2ee;min-width:0}
.tool-list-row label{display:flex;align-items:center;gap:6px;min-width:0;flex:1;line-height:1.4}
.tool-list-row label span{overflow-wrap:anywhere}
.tool-list-row input[type=checkbox]{flex:none}
.tool-list-row.done span{text-decoration:line-through;color:#99a39a}
.tool-list-row button{border:0;background:transparent;color:#9a5c56;cursor:pointer;padding:2px 5px;border-radius:5px}
.tool-list-row a{color:#275e48;overflow-wrap:anywhere;flex:1}
.tool-list-row a:hover{text-decoration:underline}
.tool-help{font-size:10px;color:#869087;line-height:1.5;margin:6px 0 0}
.tool-error{font-size:10px;color:#a3483f;min-height:15px;margin-top:5px}
.blank-prompt{min-height:185px}
.builder{border:1px solid #dce6da;border-radius:9px;background:#f8faf7;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.builder strong{font-size:11px}
.builder p{margin:0;font-size:10px;color:#7d8a7e;line-height:1.5}
.builder-options{display:flex;gap:6px;flex-wrap:wrap}
.builder-options button{border:1px solid #d7e3d6;border-radius:7px;background:#fff;padding:7px 9px;font-size:10px;color:#425e48;cursor:pointer}
.builder-options button:hover{background:#eaf2e9}
.builder textarea{width:100%;min-height:65px!important}
.builder .button{justify-content:center}
.custom-fields{display:grid;gap:8px}
.custom-field{display:grid;gap:4px;padding:7px 0;border-bottom:1px solid #eef1ec}
.custom-field label{font-size:10px;font-weight:650}
.custom-field input[type=checkbox]{justify-self:start}
.custom-field input,.custom-field textarea{width:100%}
.custom-field-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.custom-field-head button{border:0;background:transparent;color:#a4564d;cursor:pointer}
.custom-action{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
.custom-action select{flex:1;min-width:135px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#344136;padding:7px;font-size:10px}
.custom-result{min-height:23px;margin-top:8px;border-radius:6px;background:#eff5ee;padding:6px;color:#35523b;font-size:10px;overflow-wrap:anywhere}
.window-taskbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:#f6f8f5}
.window-taskbar button{border:1px solid #dce4da;background:#fff;border-radius:7px;padding:7px 10px;font-size:10px;color:#4c5a4e;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.window-taskbar button.active{border-color:#91aa96;background:#eaf2e9;color:#2d5536}
.window-taskbar button.minimized{opacity:.65}
.window-taskbar small{color:#929b92;font-size:10px;margin-left:auto}
@media(max-width:760px){.window-canvas{display:grid;gap:11px;padding:12px;min-height:0!important}
.tool-window,.tool-window.maximized{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;max-width:none;resize:none}
.window-empty{position:static;min-height:150px}
.studio-note{width:100%;margin-left:0}
}

  </style>
  <style>
.prototype-switcher select{width:auto;max-width:105px;border:1px solid #536155;border-radius:8px;padding:5px;background:#303b32;color:#fff;font-size:10px}
body[data-theme^="mono"]{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;--accent:#29292c;--tint:#ededf0;--line:#dedee0;--paper:#fff;--shadow:0 8px 22px #0000000a;background:#fff;color:#1d1d1f}
body[data-theme^="mono"] .sidebar,body[data-theme^="mono"] .project-pane{background:#e9e9eb}
body[data-theme^="mono"] .topbar{background:#fff}
body[data-theme="mono-light"] .button,body[data-theme="mono-light"] input,body[data-theme="mono-light"] select,body[data-theme="mono-light"] textarea{border-color:#a8a8ab;border-radius:4px}
body[data-theme="mono-light"] .tool-header,body[data-theme="mono-light"] .studio-toolbar{background:#f2f2f3}
body[data-theme="mono-light"] .window-canvas{background-color:#fff;background-image:none}
body[data-theme="mono-light"] .content h1{font-size:clamp(27px,3vw,40px);font-weight:600}
body[data-theme^="mono"] .mark{background:#1d1d1f}
body[data-theme^="mono"] .category-toggle,body[data-theme^="mono"] .nav-button.active,body[data-theme^="mono"] .project-row.selected,body[data-theme^="mono"] .child-button.selected{background:#ededf0;color:#242426}
body[data-theme^="mono"] .window-canvas{background-color:#f3f3f5;background-image:radial-gradient(#dadadd 1px,transparent 1px)}
body[data-theme="mono-light"] .window-canvas{background-color:#fff;background-image:none}
body[data-theme="mono-light"] .nav-button,body[data-theme="mono-light"] .category-toggle{font-size:13px}
body[data-theme="mono-light"] .tree-name,body[data-theme="mono-light"] .child-button,body[data-theme="mono-light"] .button{font-size:12px}
body[data-theme="mono-light"] .tool-header strong,body[data-theme="mono-light"] .studio-head h2{font-size:14px}
body[data-theme^="mono"] .window-studio,body[data-theme^="mono"] .card,body[data-theme^="mono"] .composer,body[data-theme^="mono"] .tool-window{border-radius:16px}
body[data-theme^="mono"] .tool-icon,body[data-theme^="mono"] .stage.current .num,body[data-theme^="mono"] .button.primary{background:#29292c;color:#fff;border-color:#29292c}
body[data-theme^="mono"] .tool-header,body[data-theme^="mono"] .studio-toolbar{background:#f7f7f9}
body[data-theme="mono-dark"]{color-scheme:dark;--line:#39393c;--muted:#a1a1a6;--paper:#1c1c1e;--accent:#f5f5f7;--shadow:0 12px 32px #00000050;background:#0b0b0d;color:#f5f5f7}

承的特点及滑动轴承分类。", "pages": [296]}, {"id": "md-071", "title": "滑动轴承的主要结构形式", "kind": "topic", "body": "核心内容：轴承座；轴瓦；止推。\n\n本主题涉及：辨认整体、对开式径向及止推轴承结构和适用场景。", "pages": [296, 297]}, {"id": "md-072", "title": "滑动轴承的失效形式及常用材料", "kind": "topic", "body": "核心内容：巴氏合金；青铜；含油轴承；聚合物。\n\n本主题涉及：识别磨损、擦伤、胶合、疲劳剥落和腐蚀，并按性能选择轴承材料。", "pages": [298, 299, 300]}, {"id": "md-073", "title": "轴瓦结构", "kind": "topic", "body": "核心内容：轴瓦；轴承衬；油槽。\n\n本主题涉及：说明整体/剖分轴瓦、定位、油槽与安装要求。", "pages": [301, 302, 303]}, {"id": "md-074", "title": "滑动轴承润滑剂的选用", "kind": "topic", "body": "核心内容：润滑剂；黏度；边界膜。\n\n本主题涉及：按边界/流体润滑状态、温度和载荷选择润滑油、脂或固体润滑剂。", "pages": [304, 305]}, {"id": "md-075", "title": "不完全流体润滑滑动轴承设计计算", "kind": "topic", "body": "核心内容：混合润滑；压力；PV；速度。\n\n本主题涉及：对径向与止推轴承校核平均压力、PV值和滑动速度。", "pages": [306, 307]}, {"id": "md-076", "title": "流体动力润滑径向滑动轴承设计计算", "kind": "topic", "body": "核心内容：楔形间隙；承载量系数；最小油膜厚度。\n\n本主题涉及：说明雷诺方程的假设、动压膜形成条件、承载量、最小膜厚和热平衡设计。", "pages": [308, 309, 319]}, {"id": "md-077", "title": "其他形式滑动轴承简介", "kind": "topic", "body": "核心内容：静压；气体润滑；磁悬浮。\n\n本主题涉及：辨认教材介绍的静压、气体润滑和磁悬浮轴承工作特点及应用条件。", "pages": [320, 321, 327]}, {"id": "md-078", "title": "13-1 概述", "kind": "topic", "body": "核心内容：内圈；外圈；滚动体；保持架。\n\n本主题涉及：辨认滚动轴承基本零件、相对运动及保持架作用。", "pages": [328]}, {"id": "md-079", "title": "滚动轴承的主要类型及其代号", "kind": "topic", "body": "核心内容：向心；推力；接触角；代号。\n\n本主题涉及：按载荷方向、接触角和结构特点识别轴承类型与代号。", "pages": [329, 330, 332]}, {"id": "md-080", "title": "滚动轴承类型的选择", "kind": "topic", "body": "核心内容：载荷；速度；调心；安装。\n\n本主题涉及：根据载荷、速度、调心、刚度和安装条件选择轴承类型。", "pages": [333, 334]}, {"id": "md-081", "title": "滚动轴承的工作情况", "kind": "topic", "body": "核心内容：接触载荷；游隙；受载区。\n\n本主题涉及：理解载荷分布、滚动体受载数量及轴承运行中的受力特点。", "pages": [335, 336, 337]}, {"id": "md-082", "title": "滚动轴承尺寸的选择", "kind": "topic", "body": "核心内容：L10寿命；当量载荷；派生轴向力。\n\n本主题涉及：按额定寿命、基本额定动/静载荷和当量载荷选尺寸，并处理成对轴承的轴向力平衡。", "pages": [338, 339, 346]}, {"id": "md-083", "title": "轴承装置的设计", "kind": "topic", "body": "核心内容：轴向定位；配合；预紧；密封。\n\n本主题涉及：设计定位、固定/游动配置、配合、游隙/预紧、润滑及密封。", "pages": [347, 348, 357]}, {"id": "md-084", "title": "其他", "kind": "topic", "body": "核心内容：高速；高温；性能比较。\n\n本主题涉及：概括高速、高温轴承与不同轴承类型性能比较中的条件限制。", "pages": [358, 359, 363]}, {"id": "md-085", "title": "联轴器的种类和特性", "kind": "topic", "body": "核心内容：刚性；挠性；弹性元件。\n\n本主题涉及：按位移补偿、弹性和缓冲能力比较刚性及挠性联轴器。", "pages": [364, 365, 370]}, {"id": "md-086", "title": "联轴器的选择", "kind": "topic", "body": "核心内容：工作系数；计算转矩；许用转矩。\n\n本主题涉及：按工况选择类型并检查计算转矩、转速、轴孔、安装和承载能力。", "pages": [371, 372, 373]}, {"id": "md-087", "title": "离合器", "kind": "topic", "body": "核心内容：牙嵌；摩擦；多盘。\n\n本主题涉及：比较牙嵌式与摩擦式离合器的接合方式、操纵及适用条件。", "pages": [374, 375, 376]}, {"id": "md-088", "title": "安全联轴器及安全离合器", "kind": "topic", "body": "核心内容：过载保护；剪切；打滑。\n\n本主题涉及：说明过载时脱开或打滑的保护方式及其限制。", "pages": [377, 378]}, {"id": "md-089", "title": "特殊功用及特殊结构的联轴器及离合器", "kind": "topic", "body": "核心内容：超越；离心；电磁粉末。\n\n本主题涉及：识别超越、离心、电磁粉末等离合器的动作条件。", "pages": [379, 380, 381]}, {"id": "md-090", "title": "15-1 概述", "kind": "topic", "body": "核心内容：轴分类；强度；刚度；振动。\n\n本主题涉及：区分转轴、心轴、传动轴及其设计任务和常用材料。", "pages": [382, 383, 384]}, {"id": "md-091", "title": "轴的结构设计", "kind": "topic", "body": "核心内容：轴肩；轴段；圆角；应力集中。\n\n本主题涉及：根据零件定位、装配、载荷与工艺确定轴段和配合，并识别提高疲劳强度的结构措施。", "pages": [385, 386, 391]}, {"id": "md-092", "title": "轴的计算", "kind": "topic", "body": "核心内容：扭转；弯扭合成；疲劳；临界转速。\n\n本主题涉及：根据载荷选择扭转、弯扭合成、疲劳、静强度、弯曲/扭转刚度及振动校核。", "pages": [392, 393, 411]}, {"id": "md-093", "title": "16-1 概述", "kind": "topic", "body": "核心内容：储能；控制；测量；弹簧类型。\n\n本主题涉及：说明弹簧的功能、载荷分类与常见形式。", "pages": [412]}, {"id": "md-094", "title": "圆柱螺旋弹簧的结构、制造、材料及许用应力", "kind": "topic", "body": "核心内容：冷卷；热卷；强压；喷丸。\n\n本主题涉及：根据载荷和环境选择弹簧结构、制造工艺、材料及许用应力。", "pages": [413, 414, 416]}, {"id": "md-095", "title": "圆柱螺旋压缩（拉伸）弹簧的设计计算", "kind": "topic", "body": "核心内容：旋绕比；有效圈数；稳定性；自振频率。\n\n本主题涉及：按强度与变形设计压缩/拉伸弹簧，并检查稳定、疲劳、静强度和振动条件。", "pages": [417, 418, 426]}, {"id": "md-096", "title": "圆柱螺旋扭转弹簧的设计计算", "kind": "topic", "body": "核心内容：扭矩；扭转角；工作圈数。\n\n本主题涉及：按弯曲应力和扭转角设计螺旋扭转弹簧并确定结构尺寸。", "pages": [427, 428, 431]}, {"id": "md-097", "title": "17-1 概述", "kind": "topic", "body": "核心内容：基础部件；定位；刚度。\n\n本主题涉及：说明机座/箱体的支承、定位、精度和抗振作用。", "pages": [432]}, {"id": "md-098", "title": "机座和箱体的一般类型与材料选择", "kind": "topic", "body": "核心内容：铸造；焊接；铝合金；花岗岩。\n\n本主题涉及：按结构、制造方式、工作要求和经济性选择机座形式及材料。", "pages": [432, 433]}, {"id": "md-099", "title": "机座和箱体设计概要", "kind": "topic", "body": "核心内容：刚度；强度；工艺；隔振。\n\n本主题涉及：归纳精度、工作能力、工艺、运输和隔振等设计要求。", "pages": [434, 435]}, {"id": "md-100", "title": "机座和箱体的截面形状及肋板布置", "kind": "topic", "body": "核心内容：截面惯性矩；肋板；扭转刚度。\n\n本主题涉及：比较截面形状和肋板布置对强度、刚度、质量与制造的影响。", "pages": [436, 437, 439]}, {"id": "md-101", "title": "减速器", "kind": "topic", "body": "核心内容：展开式；同轴式；分流式。\n\n本主题涉及：比较齿轮、蜗杆及组合减速器的传动布置特点并按需要选择。", "pages": [440, 441, 443]}, {"id": "md-102", "title": "变速器", "kind": "topic", "body": "核心内容：滑移齿轮；离合器式；摩擦无级变速。\n\n本主题涉及：比较有级齿轮变速与机械无级变速方案及其传动范围和限制。", "pages": [444, 445, 446]}, {"id": "md-103", "title": "摩擦轮传动简介", "kind": "topic", "body": "核心内容：弹性滑动；打滑；接触疲劳。\n\n本主题涉及：说明摩擦轮传力、压紧、滑动与主要失效，并据工作条件选择材料副。", "pages": [447, 448]}, {"id": "MD-C-load", "title": "载荷", "kind": "concept", "body": "载荷是作用在零件上的外力或力矩。分析零件时先确定载荷的大小、方向、作用位置和变化过程。", "pages": [25, 28]}, {"id": "MD-C-stress", "title": "应力", "kind": "concept", "body": "应力用于描述受力零件内部单位面积上的内力。强度计算需要明确危险部位、应力类型及所用假设。", "pages": [28]}, {"id": "MD-C-strength", "title": "强度", "kind": "concept", "body": "强度要求零件在相应载荷条件下避免断裂或不允许的残余变形。强度校核须与具体失效形式相联系。", "pages": [25, 28]}, {"id": "MD-C-static", "title": "静强度", "kind": "concept", "body": "静强度分析关注静载或少数较大载荷造成的破坏。塑性材料出现不允许的残余变形时，应检查与屈服有关的强度条件。", "pages": [24, 28]}, {"id": "MD-C-alternating", "title": "变应力", "kind": "concept", "body": "变应力随时间变化。分析疲劳问题时，需要考虑应力的变化特征与循环次数。", "pages": [38]}, {"id": "MD-C-fatigue", "title": "疲劳强度", "kind": "concept", "body": "疲劳强度涉及变应力反复作用后的承载能力。一次静强度校核合格，不能直接证明满足疲劳强度或指定寿命要求。", "pages": [26, 38]}, {"id": "MD-C-elastic", "title": "弹性变形", "kind": "concept", "body": "弹性变形在卸载后能够恢复。工作时的弹性变形即使能够恢复，也可能因为超过允许值而影响功能。", "pages": [25, 26]}, {"id": "MD-C-stiffness", "title": "刚度", "kind": "concept", "body": "刚度要求零件受载时的弹性变形不超过允许范围。应结合材料弹性性质、截面形状尺寸及支承条件分析。", "pages": [25, 26, 28]}, {"id": "MD-C-failure", "title": "失效形式", "kind": "concept", "body": "零件失效包括断裂、不允许的残余变形、表面破坏或正常工作条件被破坏等。没有断裂不等于能够完成预定功能。", "pages": [24, 25]}, {"id": "MD-C-criterion", "title": "设计准则", "kind": "concept", "body": "设计准则应与失效形式相联系。强度、刚度和寿命等要求分别约束不同的工作能力，实际零件可能需要多项校核。", "pages": [27, 28]}], "edges": [{"from": "module-MD01", "to": "md-001", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-002", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-003", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-004", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-005", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-006", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-007", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-008", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-009", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-010", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-011", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-012", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD01", "to": "md-013", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD02", "to": "md-014", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD02", "to": "md-015", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD02", "to": "md-016", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD02", "to": "md-017", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD02", "to": "md-018", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD03", "to": "md-019", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD03", "to": "md-020", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-MD03", "to": "md-021", "kind": "contains", "b []}, {"id": "module-TE04", "title": "第二定律、熵与火用", "kind": "module", "body": "判断过程方向和可逆性，分析效率极限、熵平衡及可用能损失。", "pages": []}, {"id": "module-TE05", "title": "水蒸气与湿空气", "kind": "module", "body": "判定物态，正确查表和插值，分析湿空气状态变化。", "pages": []}, {"id": "module-TE06", "title": "动力装置循环", "kind": "module", "body": "比较蒸汽、内燃机与燃气轮机循环，计算功热与效率。", "pages": []}, {"id": "module-TE07", "title": "制冷循环与热泵", "kind": "module", "body": "解释制冷与供热目标差异，分析不同制冷循环。", "pages": []}, {"id": "module-TE08", "title": "三种传热方式", "kind": "module", "body": "从实际设备识别导热、对流、辐射及组合传热。", "pages": []}, {"id": "module-TE09", "title": "稳态与非稳态导热", "kind": "module", "body": "依据几何与边界选模型，分析稳态热阻、非稳态和数值法入门。", "pages": []}, {"id": "module-TE10", "title": "对流换热", "kind": "module", "body": "区分流动与换热条件，按关联式适用范围计算。", "pages": []}, {"id": "module-TE11", "title": "辐射换热", "kind": "module", "body": "说明黑体与实际表面差异，建立辐射换热关系并解释遮热作用。", "pages": []}, {"id": "module-TE12", "title": "传热过程与换热器", "kind": "module", "body": "将能量平衡与传热能力联立，比较换热器和强化/削弱措施。", "pages": []}, {"id": "TE-001", "title": "能量与能源", "kind": "topic", "body": "核心内容：一次/二次能源、可再生能源。\n\n本主题涉及：区分能源与能量形式，理解热能在热工系统中的作用。", "pages": [8]}, {"id": "TE-002", "title": "热工基础的研究内容", "kind": "topic", "body": "核心内容：能量转换与热量传递；以目录及导读为边界。。\n\n本主题涉及：说明工程热力学与传热学的研究对象及全书两部分结构。", "pages": [11]}, {"id": "TE-003", "title": "热力系统", "kind": "topic", "body": "核心内容：闭口、开口、孤立系统；按所选系统边界判断。。\n\n本主题涉及：判定系统边界、系统类型及与外界的质量/能量交换。", "pages": [16]}, {"id": "TE-004", "title": "平衡状态与状态参数", "kind": "topic", "body": "核心内容：p、T、v等；简单可压缩系统的状态描述按教材假设。。\n\n本主题涉及：区分状态参数与过程量，识别热力平衡及常用状态参数。", "pages": [17]}, {"id": "TE-005", "title": "状态方程与状态参数坐标图", "kind": "topic", "body": "核心内容：状态方程、p-v/T-s图。\n\n本主题涉及：使用状态方程和状态图表示状态及状态变化。", "pages": [20]}, {"id": "TE-006", "title": "准平衡过程与可逆过程", "kind": "topic", "body": "核心内容：准平衡是系统内部近似连续平衡；可逆性要求无耗散，概念不可混同。。\n\n本主题涉及：区分准平衡过程和可逆过程，并说明过程条件。", "pages": [20]}, {"id": "TE-007", "title": "功量与热量", "kind": "topic", "body": "核心内容：功量、热量是过程量。\n\n本主题涉及：辨析功、热量与状态量，并按过程方向确定符号。", "pages": [22]}, {"id": "TE-008", "title": "热力系统的储存能", "kind": "topic", "body": "核心内容：总能量由内能及宏观动能、位能构成；忽略项须由题设决定。。\n\n本主题涉及：列举系统储存能并区分内能、动能、位能。", "pages": [27]}, {"id": "TE-009", "title": "热力学第一定律的实质", "kind": "topic", "body": "核心内容：能量守恒与转化；符号约定按教材。。\n\n本主题涉及：用能量守恒解释热力学第一定律。", "pages": [28]}, {"id": "TE-010", "title": "闭口系统表达式", "kind": "topic", "body": "核心内容：闭口系统第一定律；动能/位能变化是否保留依具体问题。。\n\n本主题涉及：对闭口系统写出能量平衡并识别边界功、热量。", "pages": [28]}, {"id": "TE-011", "title": "开口系统稳定流动能量方程", "kind": "topic", "body": "核心内容：焓含流动功；稳定流动设备项依过程简化。。\n\n本主题涉及：对稳定流动控制体列能量方程，辨认焓、流动功和技术功。", "pages": [29]}, {"id": "TE-012", "title": "应用", "kind": "topic", "body": "核心内容：节流近似等焓；各设备简化条件按题设核查。。\n\n本主题涉及：将能量方程用于换热器、透平、压缩机和节流装置。", "pages": [33]}, {"id": "TE-013", "title": "理想气体状态方程", "kind": "topic", "body": "核心内容：pv=RT。\n\n本主题涉及：计算理想气体状态并辨认模型适用性。", "pages": [39]}, {"id": "TE-014", "title": "比热容及u、h、s", "kind": "topic", "body": "核心内容：理想气体u、h主要随温度变。\n\n本主题涉及：区分定容/定压比热容并计算理想气体热力学能、焓与熵变化。", "pages": [42]}, {"id": "TE-015", "title": "理想气体混合物", "kind": "topic", "body": "核心内容：Dalton分压定律及分数组成；分数定义需按质量或摩尔基准区分。。\n\n本主题涉及：按分压力、质量/摩尔分数描述理想气体混合物。", "pages": [49]}, {"id": "TE-016", "title": "理想气体热力过程", "kind": "topic", "body": "核心内容：过程关系依理想气体和过程假设。\n\n本主题涉及：分析定容、定压、等温、等熵和多变过程的状态与能量变化。", "pages": [56]}, {"id": "TE-017", "title": "压气机压缩过程", "kind": "topic", "body": "核心内容：多级压缩压力比分配与最小功结论在理想假设下。\n\n本主题涉及：比较等温、绝热/等熵及多变压缩功，说明多级压缩与中间冷却作用。", "pages": [69]}, {"id": "TE-018", "title": "喷管流动", "kind": "topic", "body": "核心内容：收敛/扩张喷管及拉瓦尔喷管。\n\n本主题涉及：用连续方程和能量方程分析喷管加速、临界与堵塞流动。", "pages": [76]}, {"id": "TE-019", "title": "绝热滞止参数", "kind": "topic", "body": "核心内容：滞止温度/压力定义依无热交换及速度降至零的模型。。\n\n本主题涉及：区分静参数与滞止参数，并在绝热减速条件下使用。", "pages": [83]}, {"id": "TE-020", "title": "过程方向性与第二定律表述", "kind": "topic", "body": "核心内容：热量自发传递方向、循环装置限制；不可逆过程需结合系统边界理解。。\n\n本主题涉及：判断过程方向并陈述Clausius及Kelvin–Planck表述。", "pages": [89]}, {"id": "TE-021", "title": "卡诺循环与卡诺定理", "kind": "topic", "body": "核心内容：可逆热机效率只由热源温度决定；实际不可逆循环效率较低。。\n\n本主题涉及：用卡诺循环与定理比较可逆热机效率。", "pages": [90]}, {"id": "TE-022", "title": "熵", "kind": "topic", "body": "核心内容：Clausius不等式、孤立系统熵增。\n\n本主题涉及：用熵变化与熵产判断过程可逆性及孤立系统演化。", "pages": [95]}, {"id": "TE-023", "title": "火用", "kind": "topic", "body": "核心内容：环境基准温度T0下火用毁灭与熵产相关。\n\n本主题涉及：区分能量与火用，并估计不可逆导致的可用能损失。", "pages": [104]}, {"id": "TE-024", "title": "水蒸气的产生", "kind": "topic", "body": "核心内容：湿蒸汽状态需压力/温度及干度等信息；按相区使用状态表。。\n\n本主题涉及：识别未饱和液、饱和液、湿蒸汽、干饱和蒸汽、过热蒸汽及临界点。", "pages": [111]}, {"id": "TE-025", "title": "水蒸气的热力性质", "kind": "topic", "body": "核心内容：饱和状态p-T关联；混合区性质依干度加权，查表数值须核表格。。\n\n本主题涉及：用水蒸气表或h-s图查状态并计算湿蒸汽性质。", "pages": [114]}, {"id": "TE-026", "title": "水蒸气的基本热力过程", "kind": "topic", "body": "核心内容：节流近似等焓；过程计算依状态表及设备假设。。\n\n本主题涉及：分析定压、定容、等温、等熵及节流过程。", "pages": [118]}, {"id": "TE-027", "title": "湿空气的性质", "kind": "topic", "body": "核心内容：p=pa+pv；未饱和/饱和判据与湿空气图。\n\n本主题涉及：计算湿空气分压力、含湿量、相对湿度、露点及焓。", "pages": [121]}, {"id": "TE-028", "title": "湿空气的热力过程", "kind": "topic", "body": "核心内容：等含湿量加热、近似等焓绝热加湿；过程边界条件需明确。。\n\n本主题涉及：在h-d图上追踪加热、加湿、冷却和去湿过程。", "pages": [129]}, {"id": "TE-029", "title": "湿球温度计", "kind": "topic", "body": "核心内容：通风湿球的传热传质平衡假设。\n\n本主题涉及：解释湿球温度测量及其与空气湿度的关系。", "pages": [131]}, {"id": "TE-030", "title": "蒸汽动力循环", "kind": "topic", "body": "核心内容：提高初温/初压、降低背压可改善理想效率但受材料、湿度及冷却约束；再热和回热改变循环。。\n\n本主题涉及：绘制并分析朗肯循环，说明锅炉、汽轮机、冷凝器和给水泵作用。", "pages": [135]}, {"id": "TE-031", "title": "活塞式内燃机循环", "kind": "topic", "body": "核心内容：压缩比/定压或定容加热等参数定义按循环假设；边界条件不能混用。。\n\n本主题涉及：比较Otto、Diesel及混合循环的理想过程和性能参数。", "pages": [145]}, {"id": "TE-032", "title": "燃气轮机循环", "kind": "topic", "body": "核心内容：理想循环压力比、等熵设备等假设。\n\n本主题涉及：用Brayton循环描述燃气轮机并分析压气机、燃烧室和透平过程。", "pages": [154]}, {"id": "TE-033", "title": "空气压缩制冷循环", "kind": "topic", "body": "核心内容：逆向循环；压缩/膨胀设备效率影响实际COP。。\n\n本主题涉及：在循环图上识别空气制冷循环过程并计算制冷系数。", "pages": [159]}, {"id": "TE-034", "title": "蒸气压缩制冷循环", "kind": "topic", "body": "核心内容：实用循环常采用干压缩和节流，节流近似等焓；制冷剂选用需兼顾性质与安全/环境要求。。\n\n本主题涉及：识别压缩机、冷凝器、节流阀、蒸发器四部件及制冷剂状态。", "pages": [162]}, {"id": "TE-035", "title": "吸收式制冷循环", "kind": "topic", "body": "核心内容：氨-水或水-溴化锂工质对；工质对适用温区不同。。\n\n本主题涉及：说明吸收式循环用热能驱动、以溶液部件替代机械压缩的原理。", "pages": [166]}, {"id": "TE-036", "title": "热泵", "kind": "topic", "body": "核心内容：同一循环COP供热=制冷COP+1；适用经济性受温升与热源条件影响。。\n\n本主题涉及：区分制冷与供热目标并比较性能系数。", "pages": [167]}, {"id": "TE-037", "title": "导热", "kind": "topic", "body": "核心内容：Fourier定律及材料导热系数；各向同性与适用范围按教材。。\n\n本主题涉及：识别固体及静止流体中的导热并说明温度梯度驱动。", "pages": [172]}, {"id": "TE-038", "title": "TE-038 对流换热", "kind": "topic", "body": "核心内容：对流换热只发生于流体与表面之间；h受流动、物性、几何和边界条件影响。。\n\n本主题涉及：区分流体宏观对流与壁面附近导热，并使用Newton冷却关系。", "pages": [174]}, {"id": "TE-039", "title": "热辐射", "kind": "topic", "body": "核心内容：辐射可在真空传播；表面性质和绝对温度影响交换。。\n\n本主题涉及：说明热辐射无需介质并区分发射、吸收、反射。", "pages": [175]}, {"id": "TE-040", "title": "传热过程简介", "kind": "topic", "body": "核心内容：热阻网络串联。\n\n本主题涉及：将流体侧对流、壁内导热及另一侧对流串联为传热过程。", "pages": [177]}, {"id": "TE-041", "title": "导热理论基础", "kind": "topic", "body": "核心内容：Fourier定律、能量守恒；几何/物性/时间/边界条件完整给定。。\n\n本主题涉及：建立温度场、导热微分方程和单值性条件。", "pages": [181]}, {"id": "TE-042", "title": "稳态导热", "kind": "topic", "body": "核心内容：常物性平壁温度线性、圆筒对数分布；有内热源或物性变时另行建模。。\n\n本主题涉及：求解平壁、圆筒、球壁、多层壁、肋片及接触热阻问题。", "pages": [194]}, {"id": "TE-043", "title": "非稳态导热", "kind": "topic", "body": "核心内容：Bi表征内部导热/表面对流热阻，Fo表征扩散时间；教材给小Bi约0.1的集总条件，特定图表适用Fo条件需核。。\n\n本主题涉及：使用Bi、Fo、正规状况及集总参数法判断非稳态近似。", "pages": [213]}, {"id": "TE-044", "title": "导热问题的数值解法基础", "kind": "topic", "body": "核心内容：有限差分/有限元/边界元。\n\n本主题涉及：说明物理建模、离散、节点平衡、方程组求解和结果检查步骤。", "pages": [229]}, {"id": "TE-045", "title": "概述", "kind": "topic", "body": "核心内容：h受流动起因、流态、相变、物性、几何影响；定性温度随流动类型选取。。\n\n本主题涉及：用Newton冷却公式表述局部/平均对流换热并辨认影响因素。", "pages": [241]}, {"id": "TE-046", "title": "对流换热的数学描述", "kind": "topic", "body": "核心内容：连续介质、不可压缩牛顿流体和常物性为该推导假设；超出时需换模型。。\n\n本主题涉及：说明连续、动量和能量方程及几何、物理、时间、边界单值条件。", "pages": [245]}, {"id": "TE-047", "title": "外掠等壁温平板层流换热分析解简介", "kind": "topic", "body": "核心内容：教材关联式有Pr范围及层流范围限制。\n\n本主题涉及：理解边界层和Nu、Re、Pr，选择等壁温/常热流平板层流关系式。", "pages": [255]}, {"id": "TE-048", "title": "对流换热的实验研究方法", "kind": "topic", "body": "核心内容：同类现象、单值条件相似、已定特征数相等；关联式仅适用于给定范围。。\n\n本主题涉及：用相似原理安排模型实验 "body": "核心内容：闭环将输出反馈与给定比较，以偏差纠偏；开环无输出反馈。。\n\n本主题涉及：区分检测、比较、执行和被控对象；比较抗扰、精度及稳定性。", "pages": [17, 18, 19, 20]}, {"id": "CE-002", "title": "控制系统分类与性能", "kind": "topic", "body": "核心内容：按输入规律、线性/非线性、时变/定常分类；基本要求是稳定、快速、准确。。\n\n本主题涉及：按任务选典型模型并解释稳快准取舍。", "pages": [20, 21, 22]}, {"id": "CE-003", "title": "控制工程分析与综合", "kind": "topic", "body": "核心内容：分析是在系统/输入已知时求输出并评价性能；综合寻求满足给定性能的控制规律。。\n\n本主题涉及：区分分析（认识）和综合（改造）。", "pages": [22, 23]}, {"id": "CE-004", "title": "机、电、液建模", "kind": "topic", "body": "核心内容：用牛顿、欧姆、基尔霍夫等定律推导动态方程；液压非线性常做工作点线性化。。\n\n本主题涉及：列变量、方向和方程，说明简化假设。", "pages": [25, 27, 29, 30, 31]}, {"id": "CE-005", "title": "相似系统", "kind": "topic", "body": "核心内容：数学模型相同的不同物理系统可按相似变量映射与模拟。。\n\n本主题涉及：使用教材表2-1解释机械/电气/液压对应量。", "pages": [31, 32]}, {"id": "CE-006", "title": "拉普拉斯变换", "kind": "topic", "body": "核心内容：将微分方程代数化并用反变换求解。。\n\n本主题涉及：使用变换表、初始值、极点留数和部分分式。", "pages": [32, 35, 36, 37, 41]}, {"id": "CE-007", "title": "传递函数、零极点", "kind": "topic", "body": "核心内容：零初始条件下C(s)/R(s)为线性定常系统传递函数；分子根为零点、分母根为极点。。\n\n本主题涉及：从微分方程求函数，识别系统阶次。", "pages": [43, 44, 45]}, {"id": "CE-008", "title": "基本环节", "kind": "topic", "body": "核心内容：比例、积分、微分、惯性、一阶微分、振荡、二阶微分、延时是典型模型块。。\n\n本主题涉及：将系统分解为基本环节串并联。", "pages": [45, 46, 47, 48]}, {"id": "CE-009", "title": "框图与梅逊公式", "kind": "topic", "body": "核心内容：串并联和负反馈框图可等效化简；复杂信号图可用梅逊公式。。\n\n本主题涉及：列全回路、前向通道和余因子并复核。", "pages": [49, 50, 51, 55, 57, 59]}, {"id": "CE-010", "title": "典型输入与时间响应", "kind": "topic", "body": "核心内容：阶跃、斜坡、加速度、脉冲、正弦用于评价；稳定系统响应含瞬态与稳态。。\n\n本主题涉及：按工作情境选输入并区分两部分。", "pages": [64, 65, 66, 68]}, {"id": "CE-011", "title": "一、二阶系统与指标", "kind": "topic", "body": "核心内容：一阶由时间常数表征快慢；二阶由自然频率和阻尼比决定振荡。。\n\n本主题涉及：读延迟/上升/峰值/超调/调整时间，识别阻尼形态。", "pages": [69, 71, 72, 75, 78, 81]}, {"id": "CE-012", "title": "高阶系统和主导极点", "kind": "topic", "body": "核心内容：高阶响应由多个极点模态组成；最近虚轴极点可能主导动态。。\n\n本主题涉及：辨认模态，说明主导极点近似条件。", "pages": [85, 86]}, {"id": "CE-013", "title": "稳定性与劳斯判据", "kind": "topic", "body": "核心内容：渐近稳定当且仅当闭环极点实部全负；劳斯表可判稳及右半平面根数。。\n\n本主题涉及：构造劳斯表、处理零行。", "pages": [86, 87, 88, 89, 90, 91, 92]}, {"id": "CE-014", "title": "稳态误差与系统类型", "kind": "topic", "body": "核心内容：稳态误差衡量准确性；系统类型由开环积分数决定，不等同系统阶次。。\n\n本主题涉及：按阶跃、斜坡、加速度选择静态误差系数。", "pages": [95, 96, 98, 99, 100, 101]}, {"id": "CE-015", "title": "根轨迹", "kind": "topic", "body": "核心内容：开环参数变化时闭环极点在s平面的轨迹。。\n\n本主题涉及：画实轴段、渐近线、分离点、虚轴交点。", "pages": [102, 103, 104, 105, 106, 107]}, {"id": "CE-016", "title": "频率特性与Bode与Nyquist图", "kind": "topic", "body": "核心内容：正弦稳态输出同频，幅相由G(jω)确定；两种常见频响图为Nyquist与Bode。。\n\n本主题涉及：拆分基本环节，叠加dB斜率和相位。", "pages": [112, 113, 114, 115, 121, 122, 128, 129]}, {"id": "CE-017", "title": "基本环节和最小相位", "kind": "topic", "body": "核心内容：基本环节有典型斜率；最小相位系统无右半平面零极点和时延，幅相唯一对应。。\n\n本主题涉及：判断最小相位，再用幅频推相频。", "pages": [116, 117, 124, 125, 131, 132]}, {"id": "CE-018", "title": "奈氏与对数稳定判据", "kind": "topic", "body": "核心内容：开环轨迹穿越临界点或Bode相位穿越与开环右极点数决定闭环稳定性。。\n\n本主题涉及：确认穿越方向、频率区间及计数定义。", "pages": [133, 134, 135, 136, 147]}, {"id": "CE-019", "title": "裕度、闭环指标与辨识", "kind": "topic", "body": "核心内容：相角/幅值裕度衡量稳定余量；带宽表征速度；输入输出试验可辨识模型。。\n\n本主题涉及：同时报告裕度，解释带宽和噪声权衡。", "pages": [136, 137, 138, 141, 142, 143, 144, 145, 146]}, {"id": "CE-020", "title": "校正思想与方式", "kind": "topic", "body": "核心内容：校正改变零极点、频响或根轨迹以满足指标；有串联、局部反馈、顺馈/前馈复合。。\n\n本主题涉及：根据指标、结构、能量和可实现性选择。", "pages": [152, 153, 155, 156, 176]}, {"id": "CE-021", "title": "PID控制与整定", "kind": "topic", "body": "核心内容：P即时作用，I改善稳态误差但可能降低裕度；D改善阻尼但放大高频噪声。。\n\n本主题涉及：根据对象选择PI/PD/PID和整定方法。", "pages": [157, 158, 159, 160, 161]}, {"id": "CE-022", "title": "超前、滞后、滞后超前校正", "kind": "topic", "body": "核心内容：超前改善动态/相位裕度；滞后提高低频增益、改善精度并抑噪；组合兼顾两者。。\n\n本主题涉及：按新剪切频率配置，复核相位、增益和带宽。", "pages": [162, 163, 164, 166, 168, 169, 171, 172, 174]}, {"id": "CE-023", "title": "反馈与复合补偿", "kind": "topic", "body": "核心内容：局部反馈可减弱惯性/参数影响；前馈按可测给定或扰动直接补偿，常与反馈配合。。\n\n本主题涉及：由通道模型推导抵消项并考虑模型误差。", "pages": [176, 177, 178, 179, 180, 181, 182, 183, 184]}], "edges": [{"from": "module-CE01", "to": "CE-001", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-CE01", "to": "CE-002", "kind": "contains", "basis": "已有大纲范围映射  "由动作要求还原系统工作循环及关键元件作用。", "pages": []}, {"id": "module-FP08", "title": "伺服与电液比例", "kind": "module", "body": "区分控制形式、性能和应用条件，联系控制基础。", "pages": []}, {"id": "module-FP09", "title": "液压系统设计", "kind": "module", "body": "从负载与运动要求确定系统方案、元件及热平衡约束。", "pages": []}, {"id": "module-FP10", "title": "气动基础与气源", "kind": "module", "body": "解释气体状态、气源处理及气动辅助元件。", "pages": []}, {"id": "module-FP11", "title": "气动执行与控制元件", "kind": "module", "body": "分析气缸、气马达及阀的工作和选用。", "pages": []}, {"id": "module-FP12", "title": "气动基本回路", "kind": "module", "body": "分析速度、压力、时序、安全等气动回路。", "pages": []}, {"id": "module-FP13", "title": "气动程序控制", "kind": "module", "body": "把多缸动作顺序转化为程序与控制逻辑。", "pages": []}, {"id": "module-FP14", "title": "气动系统案例与符号查用", "kind": "module", "body": "综合解释机械手、钻床等系统并查用附录符号。", "pages": []}, {"id": "FP-001", "title": "流体传动的研究对象与系统组成", "kind": "topic", "body": "核心内容：液压和气压传动以有压流体为能源介质，通过元件、回路及系统实现能量传递、转换与控制。。\n\n本主题涉及：说明液压与气压传动的工作介质、基本组成和应用差异。", "pages": [8, 10]}, {"id": "FP-002", "title": "工作介质、黏性与污染控制", "kind": "topic", "body": "核心内容：工作介质的物理性质和污染影响系统可靠性及元件寿命；选用要结合压力、润滑、温度、相容性与环境要求。。\n\n本主题涉及：辨认介质类型与主要性质，解释污染控制的必要性并按工况选择工作介质。", "pages": [16, 20, 21]}, {"id": "FP-003", "title": "液体静力学与压力表示", "kind": "topic", "body": "核心内容：本章给出静压力定义及其性质，并区分绝对压力、相对压力和真空度；压力可用单位面积上的法向作用力表述。。\n\n本主题涉及：解释静止液体压力特性，换算压力基准，并辨认测压液柱关系。", "pages": [26, 28]}, {"id": "FP-004", "title": "连续性、伯努利与动量方程", "kind": "topic", "body": "核心内容：连续性、伯努利和动量方程分别体现质量、能量和动量守恒；用于分析流量/压力/速度关系及流体对固体的作用力。。\n\n本主题涉及：根据控制体和流动条件选择方程，辨认修正系数、损失项及力的方向。", "pages": [30, 32, 34, 38]}, {"id": "FP-005", "title": "管流状态、压力损失、孔口流动与空穴现象", "kind": "topic", "body": "核心内容：本章后续分节覆盖定常管流损失、孔口和缝隙流动、空穴现象及液压冲击，是流动状态与系统损失/异常分析入口。。\n\n本主题涉及：查找并比较各流动现象的定义、判据、损失计算和工程影响", "pages": [39, 40, 48, 54]}, {"id": "FP-006", "title": "液压泵的流量、分类、结构与选用", "kind": "topic", "body": "核心内容：液压泵按排量是否可调分定量泵/变量泵，按结构分齿轮、叶片和柱塞泵；理论流量由几何尺寸与转速决定，实际流量受压力影响。。\n\n本主题涉及：区分泵的吸油/压油过程、类型、噪声与选用要点，能结合负载及系统条件选泵。", "pages": [59, 60, 64, 80]}, {"id": "FP-007", "title": "液压马达与液压缸", "kind": "topic", "body": "核心内容：执行元件将液压能转换为机械能；液压马达输出旋转运动，液压缸输出往复直线或摆动运动。。\n\n本主题涉及：区分马达与缸的用途、类型、结构和工作特性；按运动形式选择执行元件。", "pages": [83, 88, 96]}, {"id": "FP-008", "title": "方向、压力、流量控制阀与阀的连接", "kind": "topic", "body": "核心内容：液压控制阀用于按要求控制液流方向、压力和流量；章内覆盖方向阀、压力阀、流量阀、叠加阀、二通插装阀及连接方式。。\n\n本主题涉及：按控制功能识别阀类，理解阀芯动作/调节特性和回路用途，辨认图形符号。", "pages": [98, 110, 117, 125]}, {"id": "FP-009", "title": "管路、油箱、过滤器、密封装置与蓄能器", "kind": "topic", "body": "核心内容：辅助元件包括管件、油箱、过滤器、密封、压力表和蓄能器等，对系统传力、运动和工作性能不可缺少。。\n\n本主题涉及：说明各辅助元件的作用，掌握油箱、过滤和密封装置的选用/设计入口。", "pages": [134, 137, 140, 144]}, {"id": "FP-010", "title": "压力、速度、多缸工作与其他基本回路", "kind": "topic", "body": "核心内容：液压基本回路由元件及管道构成并实现特定控制功能；本章按压力、速度、多缸工作和其他回路组织。。\n\n本主题涉及：对照回路图追踪进回油路径，比较控制功能、动作顺序、平稳性和效率。", "pages": [147, 152, 164, 170]}, {"id": "FP-011", "title": "典型系统图的阅读与动作分析", "kind": "topic", "body": "核心内容：典型液压系统由基本回路组合；分析系统图可从设备工况、各工步的力/速度/方向要求出发，再追踪主油路动作。。\n\n本主题涉及：能按工作循环识别元件、阀位、进回油路径及动作阶段，并比较不同设备系统的组成。", "pages": [172, 173, 178, 186]}, {"id": "FP-012", "title": "液压伺服、电液比例与计算机控制", "kind": "topic", "body": "核心内容：本章介绍液压伺服和电液比例控制的主要元件、系统组成及计算机控制技术；其控制精度和响应快速性高于普通液压系统。。\n\n本主题涉及：区分伺服控制、比例控制及计算机电液控制，沿传感/控制/执行链理解系统组成。", "pages": [187, 188, 192]}, {"id": "FP-013", "title": "液压系统设计流程与元件计算选择", "kind": "topic", "body": "核心内容：设计流程包括明确要求并分析工况、拟定原理图、计算选择元件、性能验算、绘制工作图及编制技术文件。。\n\n本主题涉及：按流程完成需求与工况分析、回路拟定、元件参数选择和性能核算；理解案例计算的前提。", "pages": [197, 202, 212]}, {"id": "FP-014", "title": "空气性质、气体状态方程与逻辑运算", "kind": "topic", "body": "核心内容：气压传动基础知识按空气物理性质、气体状态方程和逻辑运算展开，支撑后续气动系统分析与控制。。\n\n本主题涉及：解释压缩空气性质及其对传动的影响，按过程条件使用状态关系，并读懂逻辑运算章节。", "pages": [215, 217]}, {"id": "FP-015", "title": "气源、净化与供气管道", "kind": "topic", "body": "核心内容：气源装置提供压缩空气，章内还覆盖气源净化、其他辅助元件及供气系统管道设计。。\n\n本主题涉及：沿气源到执行元件梳理供气链，说明净化和管道设计的目的及选用要点。", "pages": [221, 224, 230]}, {"id": "FP-016", "title": "气缸与气动马达", "kind": "topic", "body": "核心内容：气动执行元件将压缩空气压力能转为机械能，驱动直线往复、摆动或回转运动，主要包括气缸和气动马达。。\n\n本主题涉及：按运动形式及负载需求选择气缸或马达，识别结构、动作和输出特性。", "pages": [233, 236, 238]}, {"id": "FP-017", "title": "方向、压力、流量、逻辑及比例与伺服元件", "kind": "topic", "body": "核心内容：气动控制元件调节压缩空气压力、流量、方向并发送信号；章内含方向阀、压力阀、流量阀、逻辑元件及比例/伺服阀。。\n\n本主题涉及：按功能识别元件并追踪信号与气流，理解控制元件如何组成气动回路。", "pages": [243, 248, 251, 256]}, {"id": "FP-018", "title": "换向、速度、压力、气液联动及顺序回路", "kind": "topic", "body": "核心内容：气动基本回路按换向、速度、压力、气液联动、计数、延时、安全保护/操作和顺序动作等功能组织。。\n\n本主题涉及：按回路目标分析阀和执行元件动作，说明适用场合与操作安全要求。", "pages": [258, 262, 266]}, {"id": "FP-019", "title": "行程程序控制与多缸程序回路", "kind": "topic", "body": "核心内容：程序控制使执行元件按预定顺序协调动作；本章介绍行程程序控制系统设计步骤及多缸单往复、多往复回路。。\n\n本主题涉及：从动作顺序建立程序，识别障碍信号并按章内方法设计回路。", "pages": [268, 270, 278]}, {"id": "FP-020", "title": "系统案例与元件图形符号", "kind": "topic", "body": "核心内容：案例覆盖气动机械手、气动钻床、气液动力滑台和夹紧系统；附录汇集常用液压与气动元件图形符号。。\n\n本主题涉及：按工作程序读取系统图并说明动作原理；熟悉图形符号以辅助前述元件与回路查找。", "pages": [280, 282, 288, 290]}], "edges": [{"from": "module-FP01", "to": "FP-001", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP01", "to": "FP-002", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP01", "to": "FP-003", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP01", "to": "FP-004", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP01", "to": "FP-005", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP02", "to": "FP-006", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP03", "to": "FP-007", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP04", "to": "FP-008", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP05", "to": "FP-009", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP06", "to": "FP-010", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP07", "to": "FP-011", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP08", "to": "FP-012", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP09", "to": "FP-013", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP10", "to": "FP-014", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP10", "to": "FP-015", "kind": "contains", "basis": "已有大纲范围映射"}, {"from": "module-FP11", "to": "FP-016", "k   function setup(id){

  const searchIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>';

  function layout(){

      return `<button class="mm-node mm-${p.kind} ${p.id===session.selected&&p.module===session.module?'selected':''}" data-mm="${p.kind==='root'?'root':p.kind==='module'?'module':'knowledge'}" data-id="${esc(p.id)}" data-module="${esc(p.module||'')}" data-key="${esc(p.key)}" data-state="${state(p.id)}" ${p.kind==='module'?`aria-expanded="${session.open.has(p.id)}"`:''} title="${esc(title)}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;--branch:${p.color||'#92adbd'}">${p.kind==='root'?esc(label):p.kind==='module'?`<span class="mm-number">${String(p.ordinal+1).padStart(2,'0')}</span><span class="mm-module-label">${esc(label)}</span><span class="mm-fold">${knowledge(p.id).length}<svg viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2 4 4-4 4"/></svg></span>`:`<i class="mm-state" data-state="${state(p.id)}"></i><span class="mm-label">${esc(label)}</span>${state(p.id)==='learned'?'<span class="mm-done">✓</span>':''}`}</button>`;
    }).join('');

  function place(){world.style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.scale})`;session.camera={...camera}}
  function fit(){const box=host.querySelector('.mm-canvas'),padding=innerWidth<=760?22:80;

  function zoom(factor,x,y){const box=host.querySelector('.mm-canvas');x??=box.clientWidth/2;y??=box.clientHeight/2;const next=Math.max(.18,Math.min(2.4,camera.scale*factor)),ratio=next/camera.scale;camera.x=x+(camera.x-x)*ratio;camera.y=y+(camera.y-y)*ratio;camera.scale=next;place()}

  function detailPanel(){const n=item(session.selected),evidence=source.courses[course].progress.nodes.find(n=>n.id===session.selected);if(!n)return '';

  async function openNote(button){
    if(button.disabled)return;const panel=button.closest('.mm-detail'),message=panel.querySelector('.mm-open-message');

  function openKnowledge(id,module,locate=false){const owner=modules.find(m=>m.id===module&&knowledge(m.id).includes(id))||modules.find(m=>knowledge(m.id).includes(id));if(!owner)return;
