<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台 · Personal AI Workstation</title>
  <style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#242824;background:#f8f8f6;font-synthesis:none;--line:#e7e8e4;--muted:#737973;--accent:#255f49;--tint:#edf5ef;--paper:#fff;--shadow:0 12px 30px #17281b0a}
*{box-sizing:border-box}
body{margin:0;min-width:320px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #438b67;outline-offset:2px}
.app{min-height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 7px 20px;font-size:13px;font-weight:720}
.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;color:white;background:#252d28;font-weight:700}
.muted{color:var(--muted)}
.eyebrow{color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-weight:700}
.section-title{font-size:11px;color:#858b84;font-weight:700;margin:24px 10px 8px;display:flex;align-items:center;justify-content:space-between}
.section-title button{background:transparent;border:0;color:#858b84;font-size:17px;padding:0 4px}
.nav-button,.tree-name,.tree-toggle,.child-button{border:0;background:transparent;text-align:left;color:#424a43}
.nav-button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:8px;font-size:12px}
.nav-button:hover,.tree-name:hover,.child-button:hover{background:#f2f4f0}
.nav-button.active{background:#e9f2eb;color:var(--accent);font-weight:650}
.nav-ico{width:18px;text-align:center;font-size:15px;color:#68736a}
.project-search{width:100%;border:1px solid var(--line);border-radius:8px;background:#fafbf9;padding:9px 11px;font-size:11px;outline:0}
.project-search:focus{border-color:#9bbba4;background:#fff}
.tree{display:grid;gap:3px;margin-top:10px}
.project-row{display:grid;grid-template-columns:25px minmax(0,1fr);align-items:center;border-radius:8px}
.project-row.selected,.child-button.selected{background:#e9f2eb;color:var(--accent)}
.tree-toggle{padding:7px 5px;text-align:center;color:#8a928a;font-size:10px}
.tree-name{padding:8px 4px 8px 0;border-radius:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600}
.children{margin:2px 0 7px 25px;border-left:1px solid #e5e9e3;padding-left:8px;display:grid;gap:1px}
.child-button{display:flex;align-items:center;gap:7px;width:100%;padding:7px 8px;border-radius:7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.child-dot{width:5px;height:5px;border-radius:50%;background:#9aac9d;flex:none}
.child-button.selected .child-dot{background:var(--accent)}
.empty{color:var(--muted);font-size:11px;padding:11px}
.side-bottom{margin-top:auto;padding:16px 8px 3px;border-top:1px solid var(--line);color:var(--muted);font-size:10px;line-height:1.6}
.sidebar,.project-pane{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:23px 14px 16px;min-width:0;overflow-y:auto}
.sidebar-body,.pane-body{min-height:0}
.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 30px;border-bottom:1px solid var(--line);background:#fff}
.breadcrumb{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-actions{display:flex;align-items:center;gap:8px}
.pill{font-size:10px;color:#5a6e60;background:#f0f5ef;padding:6px 9px;border-radius:20px;white-space:nowrap}
.button{border:1px solid #dfe4dd;background:#fff;border-radius:8px;padding:8px 11px;font-size:11px;color:#384139;white-space:nowrap}
.button:hover{border-color:#a8b9a9}
.button.primary{color:#fff;background:var(--accent);border-color:var(--accent)}
.button.ghost{background:#f6f7f4}
.content{max-width:1170px;margin:0 auto;padding:34px 34px 120px;width:100%}
.title-row{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:27px}
.title-row h1{font-size:clamp(23px,3vw,33px);letter-spacing:-.04em;font-weight:660;margin:8px 0 8px}
.title-row p{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
.status{display:inline-flex;align-items:center;gap:6px;color:#29694f;font-size:10px}
.status:before{content:"";width:6px;height:6px;border-radius:50%;background:#3baf72}
.cards{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
.card{border:1px solid var(--line);background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:19px;min-width:0}
.card h2{font-size:13px;margin:0 0 16px;font-weight:690}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card-head small{font-size:10px;color:var(--muted)}
.stage-list{display:grid;gap:10px}
.stage{display:grid;grid-template-columns:25px minmax(0,1fr) auto;align-items:center;gap:9px;font-size:11px;padding:11px 0;border-bottom:1px solid #f0f1ee}
.stage:last-child{border:0}
.stage .num{display:grid;place-items:center;border:1px solid #dbe4da;width:23px;height:23px;border-radius:7px;color:var(--accent);font-size:10px}
.stage small{color:var(--muted);font-size:10px}
.stage b{font-weight:630}
.stage.current .num{background:var(--accent);color:#fff;border-color:var(--accent)}
.activity{display:grid;gap:0}
.activity-row{display:grid;grid-template-columns:75px minmax(0,1fr);gap:9px;padding:11px 0;border-bottom:1px solid #f0f1ee;font-size:11px}
.activity-row:last-child{border:0}
.activity-row time{color:#969d94;font-size:10px}
.activity-row span{color:#4d574f;line-height:1.5}
.composer{margin-top:18px;border:1px solid #dae5da;border-radius:12px;background:#fff;box-shadow:var(--shadow);padding:14px}
.composer label{font-size:11px;font-weight:650}
.composer textarea{display:block;width:100%;min-height:54px;resize:vertical;border:0;outline:0;background:transparent;margin-top:10px;font:inherit;font-size:12px;line-height:1.5;color:#4a544b}
.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid #f0f1ee;padding-top:10px}
.composer-foot span{font-size:10px;color:var(--muted)}
.callout{margin-top:14px;color:var(--muted);font-size:10px;line-height:1.6}
.inspector{background:#fdfdfb;border-left:1px solid var(--line);padding:25px 18px;min-width:0}
.inspector h2{font-size:12px;margin:0 0 20px}
.fact{padding:13px 0;border-top:1px solid var(--line)}
.fact small{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}
.fact strong{font-size:11px;font-weight:600;overflow-wrap:anywhere}
.inspector .button{width:100%;justify-content:center;margin-top:18px}
.mini-list{font-size:10px;color:#59665c;line-height:2;margin-top:12px}
.prototype-switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:8px;background:#202822;color:white;border:1px solid #4d5c50;border-radius:18px;padding:7px 9px;box-shadow:0 12px 35px #1d2a2080;font-size:11px;white-space:nowrap}
.prototype-switcher button{color:white;border:0;background:#3a483d;border-radius:11px;width:30px;height:28px}
.prototype-switcher button:hover{background:#546b58}
.prototype-switcher span{padding:0 7px}
.prototype-switcher small{color:#b4c2b5;font-size:10px}
.demo-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:#8a6831;background:#f8f0df;border-radius:6px;padding:5px 7px}
.layout-a{display:grid;grid-template-columns:254px minmax(0,1fr)}
.layout-a .sidebar{height:100vh;position:sticky;top:0}
.layout-a main{min-width:0}
.layout-a .sidebar .project-search{margin-top:4px}
.layout-b{display:grid;grid-template-columns:62px 270px minmax(0,1fr)}
.icon-rail{background:#f2f4f0;border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;align-items:center;gap:9px;padding:17px 8px}
.icon-rail .mark{margin-bottom:20px}
.rail-button{border:0;background:transparent;color:#707a70;width:40px;height:40px;border-radius:10px;font-size:18px}
.rail-button.active,.rail-button:hover{background:#dce8df;color:var(--accent)}
.rail-bottom{margin-top:auto}
.layout-b .project-pane{height:100vh;position:sticky;top:0}
.layout-b .content{max-width:1060px}
.layout-b .cards{grid-template-columns:minmax(0,1fr) 250px}
.layout-c{display:grid;grid-template-columns:274px minmax(0,1fr) 248px}
.layout-c .sidebar{height:100vh;position:sticky;top:0}
.layout-c .inspector{height:100vh;position:sticky;top:0}
.layout-c .content{padding:30px 28px 120px}
.layout-c .cards{grid-template-columns:1fr}
.layout-c .card:nth-child(2){display:none}
.layout-c .section-title{margin-top:17px}
.layout-c .sidebar .project-search{margin-top:12px}
@media(max-width:1050px){.layout-c{grid-template-columns:250px minmax(0,1fr)}
.layout-c .inspector{display:none}
.layout-b{grid-template-columns:56px 240px minmax(0,1fr)}
.layout-b .cards{grid-template-columns:1fr}
}
@media(max-width:760px){.layout-a,.layout-b,.layout-c{display:block}
.layout-a .sidebar,.layout-b .project-pane,.layout-c .sidebar{height:auto;position:static;max-height:280px;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}
.layout-b .icon-rail{display:none}
.layout-a .sidebar .brand,.layout-c .sidebar .brand{padding-bottom:7px}
.layout-a .sidebar .nav-button,.layout-a .sidebar .side-bottom,.layout-b .project-pane .side-bottom,.layout-c .sidebar .side-bottom{display:none}
.sidebar,.project-pane{padding:12px 15px}
.section-title{margin:10px 8px 5px}
.tree{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.children{display:grid}
.topbar{height:52px;padding:0 17px}
.content,.layout-b .content,.layout-c .content{padding:24px 16px 110px}
.cards{grid-template-columns:1fr}
.title-row{display:block}
.title-row .button{margin-top:13px}
.top-actions .pill{display:none}
}

  </style>
  <style>
.layout-a .sidebar,.layout-c .sidebar,.layout-b .project-pane{overflow:hidden}
.sidebar-body,.pane-body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin}
.side-bottom{flex:none}
.layout-a{grid-template-columns:286px minmax(0,1fr)}
.layout-b{grid-template-columns:62px 300px minmax(0,1fr)}
.layout-c{grid-template-columns:306px minmax(0,1fr) 248px}
.category-block{margin:7px 0}
.category-toggle{display:flex;align-items:center;gap:8px;width:100%;border:0;background:#f5f7f4;color:#34463a;border-radius:8px;padding:9px 10px;text-align:left;font-size:11px;font-weight:700}
.category-toggle:hover{background:#eaf2eb}
.category-toggle .chevron{margin-left:auto;color:#829084;font-size:10px}
.category-toggle .count{color:#849187;font-size:10px;font-weight:500}
.category-projects{margin:4px 0 3px 10px;padding-left:8px;border-left:1px solid #e6ebe5}
.category-projects .project-row{grid-template-columns:22px minmax(0,1fr)}
.category-projects .children{margin-left:21px}
.tree{display:block}
.layout-b main{min-width:0}
.layout-c .sidebar .section-title{margin-top:17px}
@media(max-width:1050px){.layout-c{grid-template-columns:282px minmax(0,1fr)}
.layout-b{grid-template-columns:56px 278px minmax(0,1fr)}
}
@media(max-width:760px){.layout-a,.layout-b,.layout-c{display:block}
.layout-a .sidebar,.layout-b .project-pane,.layout-c .sidebar{max-height:360px}
.tree{display:block}
.category-projects .children{display:grid}
}

  </style>
  <style>
.window-studio{margin:0 0 20px;border:1px solid #dce6dc;background:#fff;border-radius:13px;box-shadow:var(--shadow);overflow:hidden}
.studio-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}
.studio-head h2{font-size:14px;margin:0 0 5px}
.studio-head p{font-size:11px;color:var(--muted);margin:0;line-height:1.5}
.studio-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#fafbf9}
.studio-toolbar input,.studio-toolbar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;font-size:11px;min-height:35px}
.studio-toolbar input{flex:1 1 170px;min-width:110px}
.studio-toolbar select{flex:0 0 118px}
.studio-toolbar .button{min-height:35px}
.studio-note{font-size:10px;color:var(--muted);margin-left:auto}
.window-canvas{position:relative;min-height:460px;background-color:#f7faf6;background-image:radial-gradient(#dfe7de 1px,transparent 1px);background-size:18px 18px;overflow:hidden}
.window-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:30px}
.tool-window{position:absolute;max-width:calc(100% - 32px);min-width:250px;min-height:175px;resize:both;overflow:auto;border:1px solid #cad8ca;background:#fff;border-radius:11px;box-shadow:0 12px 28px #20372a1c}
.tool-window.maximized{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;max-width:none;height:calc(100% - 16px)!important;resize:none}
.tool-header{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #e8eee6;background:#f5f8f4;cursor:grab;touch-action:none;user-select:none}
.tool-header:active{cursor:grabbing}
.tool-icon{display:grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#e3efe4;color:#356549;font-size:12px;flex:none}
.tool-header strong{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.tool-header .tool-kind{font-size:9px;color:#829084;white-space:nowrap}
.tool-header button{border:0;background:transparent;color:#7b877c;border-radius:5px;padding:2px 5px;font-size:13px;cursor:pointer}
.tool-header button:hover{background:#e6eee4;color:#294b32}
.tool-body{padding:11px;font-size:11px;color:#465147}
.tool-body textarea,.tool-body input{font:inherit;font-size:11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#344136;padding:8px;min-width:0}
.tool-body textarea{display:block;width:100%;min-height:115px;resize:vertical;line-height:1.5}
.tool-entry{display:flex;gap:6px;margin-bottom:9px}
.tool-entry input{flex:1;width:100%}
.tool-entry .button{padding:7px 9px}
.tool-list{display:grid;gap:5px}
.tool-list-row{display:flex;align-items:center;gap:6px;padding:5px 3px;border-bottom:1px solid #f0f2ee;min-width:0}
.tool-list-row label{display:flex;align-items:center;gap:6px;min-width:0;flex:1;line-height:1.4}
.tool-list-row label span{overflow-wrap:anywhere}
.tool-list-row input[type=checkbox]{flex:none}
.tool-list-row.done span{text-decoration:line-through;color:#99a39a}
.tool-list-row button{border:0;background:transparent;color:#9a5c56;cursor:pointer;padding:2px 5px;border-radius:5px}
.tool-list-row a{color:#275e48;overflow-wrap:anywhere;flex:1}
.tool-list-row a:hover{text-decoration:underline}
.tool-help{font-size:10px;color:#869087;line-height:1.5;margin:6px 0 0}
.tool-error{font-size:10px;color:#a3483f;min-height:15px;margin-top:5px}
.blank-prompt{min-height:185px}
.builder{border:1px solid #dce6da;border-radius:9px;background:#f8faf7;padding:10px;margin-bottom:10px;display:grid;gap:8px}
.builder strong{font-size:11px}
.builder p{margin:0;font-size:10px;color:#7d8a7e;line-height:1.5}
.builder-options{display:flex;gap:6px;flex-wrap:wrap}
.builder-options button{border:1px solid #d7e3d6;border-radius:7px;background:#fff;padding:7px 9px;font-size:10px;color:#425e48;cursor:pointer}
.builder-options button:hover{background:#eaf2e9}
.builder textarea{width:100%;min-height:65px!important}
.builder .button{justify-content:center}
.custom-fields{display:grid;gap:8px}
.custom-field{display:grid;gap:4px;padding:7px 0;border-bottom:1px solid #eef1ec}
.custom-field label{font-size:10px;font-weight:650}
.custom-field input[type=checkbox]{justify-self:start}
.custom-field input,.custom-field textarea{width:100%}
.custom-field-head{display:flex;align-items:center;justify-content:space-between;gap:6px}
.custom-field-head button{border:0;background:transparent;color:#a4564d;cursor:pointer}
.custom-action{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}
.custom-action select{flex:1;min-width:135px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#344136;padding:7px;font-size:10px}
.custom-result{min-height:23px;margin-top:8px;border-radius:6px;background:#eff5ee;padding:6px;color:#35523b;font-size:10px;overflow-wrap:anywhere}
.window-taskbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:#f6f8f5}
.window-taskbar button{border:1px solid #dce4da;background:#fff;border-radius:7px;padding:7px 10px;font-size:10px;color:#4c5a4e;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.window-taskbar button.active{border-color:#91aa96;background:#eaf2e9;color:#2d5536}
.window-taskbar button.minimized{opacity:.65}
.window-taskbar small{color:#929b92;font-size:10px;margin-left:auto}
@media(max-width:760px){.window-canvas{display:grid;gap:11px;padding:12px;min-height:0!important}
.tool-window,.tool-window.maximized{position:relative!important;left:auto!important;top:auto!important;width:auto!important;height:auto!important;max-width:none;resize:none}
.window-empty{position:static;min-height:150px}
.studio-note{width:100%;margin-left:0}
}

  </style>
  <style>
.prototype-switcher select{width:auto;max-width:105px;border:1px solid #536155;border-radius:8px;padding:5px;background:#303b32;color:#fff;font-size:10px}
body[data-theme^="mono"]{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;--accent:#29292c;--tint:#ededf0;--line:#dedee0;--paper:#fff;--shadow:0 8px 22px #0000000a;background:#fff;color:#1d1d1f}
body[data-theme^="mono"] .sidebar,body[data-theme^="mono"] .project-pane{background:#e9e9eb}
body[data-theme^="mono"] .topbar{background:#fff}
body[data-theme="mono-light"] .button,body[data-theme="mono-light"] input,body[data-theme="mono-light"] select,body[data-theme="mono-light"] textarea{border-color:#a8a8ab;border-radius:4px}
body[data-theme="mono-light"] .tool-header,body[data-theme="mono-light"] .studio-toolbar{background:#f2f2f3}
body[data-theme="mono-light"] .window-canvas{background-color:#fff;background-image:none}
body[data-theme="mono-light"] .content h1{font-size:clamp(27px,3vw,40px);font-weight:600}
body[data-theme^="mono"] .mark{background:#1d1d1f}
body[data-theme^="mono"] .category-toggle,body[data-theme^="mono"] .nav-button.active,body[data-theme^="mono"] .project-row.selected,body[data-theme^="mono"] .child-button.selected{background:#ededf0;color:#242426}
body[data-theme^="mono"] .window-canvas{background-color:#f3f3f5;background-image:radial-gradient(#dadadd 1px,transparent 1px)}
body[data-theme="mono-light"] .window-canvas{background-color:#fff;background-image:none}
body[data-theme="mono-light"] .nav-button,body[data-theme="mono-light"] .category-toggle{font-size:13px}
body[data-theme="mono-light"] .tree-name,body[data-theme="mono-light"] .child-button,body[data-theme="mono-light"] .button{font-size:12px}
body[data-theme="mono-light"] .tool-header strong,body[data-theme="mono-light"] .studio-head h2{font-size:14px}
body[data-theme^="mono"] .window-studio,body[data-theme^="mono"] .card,body[data-theme^="mono"] .composer,body[data-theme^="mono"] .tool-window{border-radius:16px}
body[data-theme^="mono"] .tool-icon,body[data-theme^="mono"] .stage.current .num,body[data-theme^="mono"] .button.primary{background:#29292c;color:#fff;border-color:#29292c}
body[data-theme^="mono"] .tool-header,body[data-theme^="mono"] .studio-toolbar{background:#f7f7f9}
body[data-theme="mono-dark"]{color-scheme:dark;--line:#39393c;--muted:#a1a1a6;--paper:#1c1c1e;--accent:#f5f5f7;--shadow:0 12px 32px #00000050;background:#0b0b0d;color:#f5f5f7}

  </style>
  <link rel="stylesheet" href="/workbench/education-network.css">
  <script src="/workbench/education-network.js"></script>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="browser-portals"></div>
  <div class="demo-statusbar" aria-label="工作区状态"><span id="demo-status-context">本机工作区</span><span class="save-indicator"><span id="layout-save-status" role="status">正在恢复界面…</span><button id="layout-save-retry" hidden></button></span><span>UTF-8　·　本地工作台</span></div>
  <script>
    const variants = [
      {id:"a", name:"常驻侧栏"},
      {id:"b", name:"图标栏 + 项目树"},
      {id:"c", name:"项目树 + 详情栏"}
    ];
    // 已登记项目是工具访问的权限上下文；自定义分类和小项目随界面状态保存。
    const projects = [
      {id:"console", name:"Workstation-Visual-Console", children:[{id:"workbench",name:"网页工作台"},{id:"plugins",name:"工作流插件"},{id:"native",name:"原生备选"}]},
      {id:"university", name:"University", children:[{id:"control",name:"控制工程"},{id:"fluid",name:"液压传动"},{id:"machine",name:"机械设计"},{id:"math",name:"数学竞赛"},{id:"thermal",name:"热工基础"}]},
      {id:"challenge", name:"ChallengeCup2026", children:[{id:"materials",name:"申报材料"},{id:"data",name:"研究数据"},{id:"presentation",name:"成果展示"}]},
      {id:"business", name:"Guochuang2026-BizPlan", children:[{id:"plan",name:"商业计划"},{id:"evidence",name:"佐证材料"}]},
      {id:"sandbox", name:"Sandbox", children:[]}
    ];
    const categories = [
      {id:"writing",name:"文字处理",icon:"▤",projects:["challenge","business"]},
      {id:"education",name:"教育学习",icon:"▧",projects:["university"]},
      {id:"tools",name:"工具与开发",icon:"⌘",projects:["console"]},
      {id:"experiments",name:"实验与临时",icon:"◫",projects:["sandbox"]}
    ];
    const baseCategories=categories.map(category=>({...category,projects:[...category.projects]}));
    const baseChildren=new Map(projects.map(project=>[project.id,project.children.map(child=>({...child}))]));
    const state = {variant:"b",theme:"vscode",view:"project",project:"console",child:"workbench",open:new Set(["console","university"]),openCategories:new Set(["writing","education","tools"]),projectPaneOpen:true,projectPaneWidth:null,layoutOpen:false,progressOpen:false,create:null,reveal:null,query:"",notice:""};
    const boards = new Map([["console/workbench",[
      {id:1,kind:"blank",title:"内容区 1",builderOpen:false},
      {id:2,kind:"blank",title:"内容区 2",builderOpen:false}
    ]]]);
    const boardLayouts=new Map(),splitTrees=new Map();
    let windowSerial=2,fieldSerial=0,annotationSerial=0,dividerDrag=null,projectDrag=null;
    const boardKey = () => `${state.project}/${state.child||"overview"}`;
    const projectUsage=new Map();
    const planItems=[];
    const planDraft={title:"",due:"",error:""};
    
    
    
    let usageLastTick=Date.now(),usageWasActive=false,usageProject=null;
    function usageEligible(){return state.view==="project"&&document.visibilityState==="visible"&&document.hasFocus()}
    function tickUsage(){const now=Date.now();if(usageWasActive&&usageProject){const elapsed=Math.max(0,Math.min(5,(now-usageLastTick)/1000));projectUsage.set(usageProject,(projectUsage.get(usageProject)||0)+elapsed)}usageLastTick=now;usageWasActive=usageEligible();usageProject=usageWasActive?state.project:null}
    function formatUsage(value){const seconds=Math.max(0,Math.floor(Number(value)||0)),hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60);return hours?`${hours}时${minutes}分`:`${minutes}分${seconds%60}秒`}
    
    
    
    function currentWindows(){const key=boardKey();if(!boards.has(key))boards.set(key,[]);return boards.get(key)}
    function findWindow(id){return currentWindows().find(item=>item.id===Number(id))}
    const escapeHtml = value => String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char]));
    const selectedProject = () => projects.find(item=>item.id===state.project)||projects[0];
    const projectFolder = project => project.folder||project.name;
    const projectIdForFolder = folder => `p_${folder.toLowerCase()}`;
    const selectedChild = () => selectedProject().children.find(item=>item.id===state.child);
    const selectedCategory = () => categories.find(item=>item.projects.includes(state.project))||categories[0];
    function recommendedLayout(projectId){
      const project=projects.find(item=>item.id===projectId),existing=project?.children.map(child=>boardLayouts.get(`${projectId}/${child.id}`)).find(Boolean);
      if(existing)return existing;
      const category=categories.find(item=>item.projects.includes(projectId));
      return {challenge:"side-stack",business:"side-stack",university:"top-bottom",console:"halves",sandbox:"single"}[projectId]||{writing:"side-stack",education:"top-bottom",tools:"halves",experiments:"single"}[category?.id]||"halves";
    }
    function projectCreateForm(){
      const draft=state.create;if(!draft)return "";
      const project=projects.find(item=>item.id===draft.project),category=categories.find(item=>item.id===draft.category);
      const title=draft.kind==="category"?"新建分类":draft.kind==="child"?`在 ${project?.name||"项目"} 下新建小项目`:draft.kind==="project"?`在 ${category?.name||"分类"} 下新建项目`:`归入 ${category?.name||"分类"} 的项目`;
      let fields="";
      if(draft.kind==="category")fields=`<label>分类名称<input data-role="create-name" name="name" maxlength="40" required value="${escapeHtml(draft.name||"")}" placeholder="例如：科研写作"></label>`;
      if(draft.kind==="child"){
        const recommended=recommendedLayout(draft.project),chosen=draft.layout||recommended;
        fields=`<label>小项目名称<input data-role="create-name" name="name" maxlength="60" required value="${escapeHtml(draft.name||"")}" placeholder="例如：课程笔记"></label><label>初始分割布局<select name="layout">${layoutCatalog.map(layout=>`<option value="${layout.id}" ${layout.id===chosen?"selected":""}>${escapeHtml(layout.name)}${layout.id===recommended?" · 推荐":""}</option>`).join("")}</select></label><small>新页面使用相同的工作台功能，内容与进度独立；建好后可随时换布局。</small>`;
      }
      if(draft.kind==="project"){
        const recommended={writing:"side-stack",education:"top-bottom",tools:"halves",experiments:"single"}[category?.id]||"halves",chosen=draft.layout||recommended;
        fields=`<label>项目名称<input data-role="create-name" name="name" maxlength="60" required value="${escapeHtml(draft.name||"")}" placeholder="例如：课程资料整理"></label><label>目录名（可选）<input name="folder" maxlength="64" value="${escapeHtml(draft.folder||"")}" placeholder="留空自动生成；也可填英文名称"></label><label>项目说明（可选）<textarea name="description" maxlength="1000" placeholder="这个项目要完成什么">${escapeHtml(draft.description||"")}</textarea></label><label>初始分割布局<select name="layout">${layoutCatalog.map(layout=>`<option value="${layout.id}" ${layout.id===chosen?"selected":""}>${escapeHtml(layout.name)}${layout.id===recommended?" · 推荐":""}</option>`).join("")}</select></label><small>会在工作站 Projects 下创建真实项目目录；新项目的内容和进度独立保存。</small>`;
      }
      if(draft.kind==="assign")fields=`<label>选择已登记项目<select name="project">${projects.filter(item=>!category?.projects.includes(item.id)).map(item=>`<option value="${item.id}" ${draft.projectChoice===item.id?"selected":""}>${escapeHtml(item.name)} · 当前在 ${escapeHtml(categories.find(group=>group.projects.includes(item.id))?.name||"未分类")}</option>`).join("")}</select></label><small>仅调整工作台中的分类，不移动项目文件。</small>`;
      return `<form class="tree-create" data-role="project-create"><strong>${escapeHtml(title)}</strong>${fields}${draft.error?`<p class="tree-create-error" role="alert">${escapeHtml(draft.error)}</p>`:""}<div class="tree-create-actions"><button type="submit" ${draft.loading?"disabled":""}>${draft.loading?"创建中…":draft.kind==="assign"?"归入分类":"创建"}</button><button type="button" data-action="cancel-create" ${draft.loading?"disabled":""}>取消</button></div></form>`;
    }
    function tree(){
      const query=state.query.trim().toLocaleLowerCase();
      const rows=categories.map(category=>{
        const categoryMatch=category.name.toLocaleLowerCase().includes(query);
        const matches=category.projects.map(id=>projects.find(project=>project.id===id)).filter(Boolean).map(project=>{
          const parentMatch=categoryMatch||project.name.toLocaleLowerCase().includes(query);
          const children=project.children.filter(child=>!query||parentMatch||child.name.toLocaleLowerCase().includes(query));
          if(query&&!parentMatch&&!children.length)return "";
          const expanded=state.open.has(project.id)||Boolean(query);
          return `<div class="project-group"><div class="project-row ${state.project===project.id&&!state.child?"selected":""}"><button class="tree-toggle" data-action="toggle" data-project="${project.id}" aria-label="${expanded?"折叠":"展开"} ${escapeHtml(project.name)}" aria-expanded="${expanded}">${project.children.length?expanded?"▾":"▸":"·"}</button><button class="tree-name" data-action="select-project" data-project="${project.id}" title="${escapeHtml(project.name)}">${escapeHtml(project.name)}</button><button class="tree-add" data-action="open-create" data-kind="child" data-project="${project.id}" title="新增小项目" aria-label="在 ${escapeHtml(project.name)} 下新增小项目">＋</button></div>${expanded&&children.length?`<div class="children">${children.map(child=>`<button class="child-button ${state.project===project.id&&state.child===child.id?"selected":""}" data-action="select-child" data-project="${project.id}" data-child="${child.id}"><span class="child-dot"></span><span class="child-label">${escapeHtml(child.name)}</span><small class="child-progress">${Math.max(0,Math.min(100,Number(child.progress)||0))}%</small></button>`).join("")}</div>`:""}</div>`;
        }).filter(Boolean);
        if(query&&!matches.length&&!categoryMatch)return "";
        const expanded=state.openCategories.has(category.id)||Boolean(query);
        return `<div class="category-block"><div class="category-head"><button class="category-toggle" data-action="toggle-category" data-category="${category.id}" aria-expanded="${expanded}"><span>${category.icon}</span><span>${escapeHtml(category.name)}</span><span class="count">${category.projects.length}</span><span class="chevron">${expanded?"▾":"▸"}</span></button><button class="tree-add" data-action="open-create" data-kind="assign" data-category="${category.id}" title="归类已有项目" aria-label="向 ${escapeHtml(category.name)} 归类已有项目">↳</button><button class="tree-add" data-action="open-create" data-kind="project" data-category="${category.id}" title="新建项目" aria-label="在 ${escapeHtml(category.name)} 下新建项目">＋</button></div>${expanded?`<div class="category-projects">${category.id==="education"?`<button class="child-button ${educationActive()?"selected":""}" data-action="open-education"><span class="child-dot"></span><span>知识网络</span></button>`:""}${matches.join("")||'<div class="empty">暂无项目，点击右侧“＋”新建项目。</div>'}</div>`:""}</div>`;
      }).filter(Boolean).join("");
      return `<div class="tree">${rows||'<div class="empty">没有匹配的项目</div>'}</div>`;
    }
    function projectArea(){return `<div class="section-title">按功能分类的项目 <button data-action="open-create" data-kind="category" title="新增分类" aria-label="新增分类">＋</button></div>${projectCreateForm()}<input class="project-search" type="search" placeholder="搜索分类、项目或小项目" value="${escapeHtml(state.query)}" aria-label="搜索分类和项目">${tree()}`}
    
    
    function nav(){return `<div class="section-title">工作区</div><button class="nav-button active" data-action="demo"><span class="nav-ico">⌂</span> 总览</button><button class="nav-button" data-action="demo"><span class="nav-ico">▤</span> 项目操作</button><button class="nav-button" data-action="demo"><span class="nav-ico">⚙</span> 设置</button>`}
    function side(){return `<aside class="sidebar"><div class="brand"><span class="mark">W</span><span>Personal Workstation</span></div><div class="sidebar-body"><button class="nav-button" data-action="demo" style="border:1px solid var(--line);margin-bottom:5px"><span class="nav-ico">＋</span> 新建任务</button>${nav()}${projectArea()}</div><div class="side-bottom">本机工作台 · 布局演示<br>功能分类与小项目关系暂作示意</div></aside>`}
    function pane(){return `<aside class="project-pane"><div class="brand"><span>项目</span><button class="project-hide" data-action="toggle-project-pane" title="隐藏项目栏" aria-label="隐藏项目栏">‹</button></div><div class="pane-body"><button class="control-nav ${state.view==="console"?"active":""}" data-action="open-console" aria-current="${state.view==="console"?"page":"false"}"><span>⌂</span><span>中控台</span></button>${projectArea()}</div><div class="side-bottom">项目内容自动保存在本机</div></aside>`}
    
    const WORKBENCH_TOKEN="__TOKEN__";
    const toolNames={blank:"空白",document:"文档",todo:"待办",browser:"内置浏览器",files:"文件资源管理器",terminal:"终端 · pwsh",custom:"自定义"};
    const toolIcons={blank:"□",document:"✎",todo:"☑",browser:"◉",files:"▤",terminal:"⌘",custom:"▦"};
    const fieldNames={text:"短文本",textarea:"长文本",number:"数字",checkbox:"勾选",url:"网址"};
    const actionNames={none:"只记录",sum_numbers:"数字求和",subtract_numbers:"首项减其余",count_checked:"统计勾选",copy_summary:"复制摘要",open_first_url:"打开首个网址"};
    const uiNames={editor:"编辑器",cards:"卡片",minimal:"极简"};
    const uxNames={direct:"直接填写",guided:"逐项引导",review:"先预览后编辑"};
    const formatNames={form:"表单",split:"双栏",dashboard:"仪表盘"};
    const layoutCatalog=[
      {id:"single",name:"整块",hint:"不分割",slots:[[0,0,1,1]]},
      {id:"halves",name:"左右",hint:"一条可拖动竖线",slots:[[0,0,.5,1],[.5,0,.5,1]]},
      {id:"top-bottom",name:"上下",hint:"一条可拖动横线",slots:[[0,0,1,.5],[0,.5,1,.5]]},
      {id:"thirds",name:"三栏",hint:"两条可拖动竖线",slots:[[0,0,1/3,1],[1/3,0,1/3,1],[2/3,0,1/3,1]]},
      {id:"side-stack",name:"主区＋右侧上下",hint:"竖线与横线",slots:[[0,0,.62,1],[.62,0,.38,.5],[.62,.5,.38,.5]]},
      {id:"quad",name:"四格",hint:"两侧各有可拖动横线",slots:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]]}
    ];
    function blankWindow(id,title){return {id,kind:"blank",template:"blank",title,builderOpen:false,uiStyle:"editor",uxMode:"direct",format:"form",formatNotes:"",codexText:"",values:{},annotations:[],step:0,editing:false}}
    function newBlankWindow(title){return blankWindow(++windowSerial,title)}
    const leaf=id=>({paneId:id});
    const split=(direction,ratio,first,second)=>({direction,ratio,first,second});
    function makeSplitTree(layoutId,ids){const p=index=>leaf(ids[index]);switch(layoutId){
      case "single":return p(0);
      case "top-bottom":return split("horizontal",.5,p(0),p(1));
      case "thirds":return split("vertical",1/3,p(0),split("vertical",.5,p(1),p(2)));
      case "side-stack":return split("vertical",.62,p(0),split("horizontal",.5,p(1),p(2)));
      case "quad":return split("vertical",.5,split("horizontal",.5,p(0),p(2)),split("horizontal",.5,p(1),p(3)));
      default:return split("vertical",.5,p(0),p(1));
    }}
    function applyLayout(layoutId){const layout=layoutCatalog.find(entry=>entry.id===layoutId);if(!layout)return false;const windows=currentWindows();while(windows.length<layout.slots.length)windows.push(newBlankWindow(`内容区 ${windows.length+1}`));boardLayouts.set(boardKey(),layoutId);splitTrees.set(boardKey(),makeSplitTree(layoutId,windows.map(item=>item.id)));return true}
    function ensureSplitTree(){if(!splitTrees.has(boardKey()))applyLayout(boardKey()==="console/workbench"?"halves":"single");return splitTrees.get(boardKey())}
    function findSplitNode(path){let node=ensureSplitTree();for(const step of path){node=step==="0"?node?.first:node?.second}return node?.direction?node:null}
    function renderTemplateGallery(){if(!state.layoutOpen)return "";return `<section class="desk-popover template-gallery" aria-label="选择分割布局"><div class="popover-head"><strong>分割线类型</strong><button data-action="close-popovers" aria-label="关闭布局选择">×</button></div><div class="template-grid">${layoutCatalog.map(layout=>`<button class="template-card" data-action="select-layout" data-layout="${layout.id}" aria-pressed="${boardLayouts.get(boardKey())===layout.id}"><span class="template-preview" aria-hidden="true">${layout.slots.map(slot=>`<i style="left:${slot[0]*100}%;top:${slot[1]*100}%;width:${slot[2]*100}%;height:${slot[3]*100}%"></i>`).join("")}</span><strong>${layout.name}</strong><small>${layout.hint}</small></button>`).join("")}</div><p class="layout-hint">拖动分割线可调整比例；切换类型会保留已有内容。</p></section>`}
    function renderBuilder(item){
      if(!item.builderOpen)return "";
      const manual=item.kind==="custom"?`<div class="tool-entry"><input class="field-name-input" data-window-id="${item.id}" placeholder="字段名称" aria-label="字段名称"><select class="field-kind-select" data-window-id="${item.id}">${Object.entries(fieldNames).map(([value,name])=>`<option value="${value}">${name}</option>`).join("")}</select><button class="button" data-action="add-field" data-window-id="${item.id}">＋ 字段</button></div><div class="custom-action"><span>内置操作</span><select class="custom-action-select" data-window-id="${item.id}" aria-label="内容区操作">${Object.entries(actionNames).map(([value,name])=>`<option value="${value}" ${item.schema?.action===value?"selected":""}>${name}</option>`).join("")}</select></div>`:"";
      return `<div class="builder"><div class="primary-actions"><strong>主内容</strong><button class="button" data-action="configure-window" data-window-id="${item.id}">关闭选择</button>${item.kind!=="blank"?`<button class="button" data-action="clear-window" data-window-id="${item.id}">取消当前内容</button>`:""}</div><p>每个内容区只放一种主内容；笔记和外部链接通过标注附着在主内容上。</p><div class="builder-options">${["document","todo","browser","files","terminal","custom"].map(kind=>`<button data-action="set-preset" data-window-id="${item.id}" data-preset="${kind}">${toolNames[kind]}</button>`).join("")}</div>${manual}<div class="builder-grid"><label>呈现格式<select data-role="window-format" data-window-id="${item.id}">${Object.entries(formatNames).map(([value,name])=>`<option value="${value}" ${(item.format||"form")===value?"selected":""}>${name}</option>`).join("")}</select></label><label>UI 风格<select data-role="ui-style" data-window-id="${item.id}">${Object.entries(uiNames).map(([value,name])=>`<option value="${value}" ${(item.uiStyle||"editor")===value?"selected":""}>${name}</option>`).join("")}</select></label><label>UX 交互<select data-role="ux-mode" data-window-id="${item.id}">${Object.entries(uxNames).map(([value,name])=>`<option value="${value}" ${(item.uxMode||"direct")===value?"selected":""}>${name}</option>`).join("")}</select></label><label>格式细节<input data-role="format-notes" data-window-id="${item.id}" maxlength="200" value="${escapeHtml(item.formatNotes||"")}" placeholder="例如：三列指标、左右对照"></label></div><label>一句话扩展内容<input class="codex-description" data-role="codex-description" data-window-id="${item.id}" maxlength="1000" value="${escapeHtml(item.codexText||"")}" placeholder="例如：记录项目预算并自动计算差额"></label><button class="button primary" data-action="codex-draft" data-window-id="${item.id}" ${item.loading?"disabled":""}>${item.loading?"Codex 正在制作…":"提交给 Codex 制作预览"}</button><p>只生成受限字段与内置操作；结果在当前内容区试用，刷新后清空。</p><div class="tool-error" data-error-for="${item.id}" role="status">${escapeHtml(item.error||"")}</div></div>`;
    }
    function renderCustom(item){
      const schema=item.schema||{fields:[],action:"none"},values=item.values||{};
      const intro=`<p class="tool-help">${escapeHtml(schema.description||"按需填写内容区字段。")}</p>`;
      if(item.uxMode==="review"&&!item.editing){const rows=schema.fields.map(field=>`<div class="ux-review-row"><span>${escapeHtml(field.label)}</span><strong>${escapeHtml(field.kind==="checkbox"?(values[field.id]?"已勾选":"未勾选"):(values[field.id]??"—"))}</strong></div>`).join("");return `${intro}<div class="ux-review">${rows||'<p class="tool-help">暂无字段。</p>'}</div><button class="button" data-action="ux-edit" data-window-id="${item.id}">编辑内容</button>${item.result?`<div class="custom-result" role="status">${escapeHtml(item.result)}</div>`:""}`}
      const step=Math.max(0,Math.min(schema.fields.length-1,item.step||0));
      const fields=item.uxMode==="guided"?schema.fields.slice(step,step+1):schema.fields;
      const controls=item.uxMode==="guided"&&schema.fields.length?`<div class="ux-stepper"><button class="button" data-action="ux-prev" data-window-id="${item.id}" ${step===0?"disabled":""}>← 上一项</button><span>${step+1} / ${schema.fields.length}</span><button class="button" data-action="ux-next" data-window-id="${item.id}" ${step===schema.fields.length-1?"disabled":""}>下一项 →</button></div>`:"";

    window.addEventListener("pagehide",()=>{tickUsage();scheduleSave();flushSave(true);for(const items of boards.values())for(const item of items)if(item.terminalSession)fetch("/api/workbench/terminal/close",{method:"POST",headers:{"Content-Type":"application/json","X-Workstation-Token":WORKBENCH_TOKEN},body:JSON.stringify({session_id:item.terminalSession}),keepalive:true})});
    
    initializeWorkbench();
  </script>
</body>
</html>
